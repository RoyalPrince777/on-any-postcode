name: Founder 429 diagnostic safety

on:
  pull_request:
    paths:
      - 'scripts/probe_founder_429.sh'
      - 'tests/test_founder_429_probe.py'
      - 'docs/FOUNDER_429_RECOVERY_GATE.md'
      - '.github/workflows/founder-429-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify probe safety contract
        run: python -m pytest -q tests/test_founder_429_probe.py
      - name: Shell syntax
        run: sh -n scripts/probe_founder_429.sh
