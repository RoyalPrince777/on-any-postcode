name: Temporary Movement migration generator

on:
  push:
    branches:
      - build/movement-operations-v1
    paths:
      - .github/workflows/temporary-generate-movement-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/movement-operations-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate exact audited SQL
        run: |
          mkdir -p migrations
          python - <<'PY'
          from pathlib import Path
          from mission_control.movement_operations import migration_sql
          Path('migrations/0005_movement_operations.sql').write_text(migration_sql())
          PY
          grep -Fq "0005_movement_operations" migrations/0005_movement_operations.sql
          git diff --check
      - name: Commit generated migration
        run: |
          git config user.name "RoyalPrince777"
          git config user.email "actions@users.noreply.github.com"
          git add migrations/0005_movement_operations.sql
          git diff --cached --quiet && exit 0
          git commit -m "Record Movement operations migration SQL"
          git push origin HEAD:build/movement-operations-v1
