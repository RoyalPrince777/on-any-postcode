name: SMI homepage real Chromium acceptance
on:
  pull_request:
    paths:
      - "templates/smi_command_home.html"
      - "tests/test_smi_home_chromium.py"
      - "app.py"
      - ".github/workflows/smi-home-chromium.yml"
  workflow_dispatch:
jobs:
  smi-home-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install "Flask==3.0.3" "playwright>=1.50,<2" "pytest>=8,<10"
          python -m playwright install --with-deps chromium
      - name: Run actual Chromium desktop and mobile checks
        run: python -m pytest -q tests/test_smi_home_chromium.py
