name: OAP Core local-first v29 compile proof
on:
  push:
    branches:
      - fix/koradaso-browser-viewport-v29-20261102
    paths:
      - 'android/oaphome/**'
      - 'tests/test_oap_home_v2_native_royal.py'
      - '.github/workflows/koradaso-local-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native source contracts
        run: python3 tests/test_oap_home_v2_native_royal.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile native Java only - no APK published
        working-directory: android/oaphome
        run: gradle --no-daemon compileDebugJavaWithJavac
