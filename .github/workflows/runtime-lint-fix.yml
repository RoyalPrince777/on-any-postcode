name: Fix organism runtime lint

on:
  push:
    branches:
      - build/organism-runtime-24x7

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/organism-runtime-24x7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('mission_control/organism_runtime.py')
          text = runtime.read_text()
          text = text.replace('import math\n', '', 1)
          text = text.replace(
              'raise ValueError("runtime payload must be an object")',
              'raise TypeError("runtime payload must be an object")',
              1,
          )
          runtime.write_text(text)
          PY
          python -m pip install ruff
          ruff check --fix mission_control/organism_runtime.py mission_control/organism_worker.py tests/test_organism_runtime_24x7.py
          git diff --check
      - name: Commit exact lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mission_control/organism_runtime.py mission_control/organism_worker.py tests/test_organism_runtime_24x7.py
          git commit -m "Fix organism runtime lint gate"
          git push origin HEAD:build/organism-runtime-24x7
