name: Promote OAP Core immutable image

on:
  push:
    branches: [main]
    paths:
      - "deploy/render-core-release.json"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROMOTE to apply the exact existing-service image promotion"
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'PROMOTE' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v5

      - name: Run release preflight
        env:
          OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          python scripts/release_preflight.py

      - name: Verify immutable release contract
        run: |
          python - <<'PY'
          import json
          manifest=json.load(open("deploy/render-core-release.json"))
          assert manifest["service"]["render_service_id"] == "srv-d8gfsv0jo6nc73egdlf0"
          assert manifest["image"]["immutable_ref"] == (
              "ghcr.io/royalprince777/on-any-postcode-runtime@"
              "sha256:31e1a236c954811cb00868897c614a5b655a8b2cfb9c844f4e80d6c231453d8a"
          )
          assert manifest["release_commit"] == "1c0e817e102afb836d6c6236aeb511769d0c9ec5"
          print("immutable-release-contract-ok")
          PY

      - name: Promote exact existing Core service image
        env:
          OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, urllib.parse, urllib.request

          manifest=json.load(open("deploy/render-core-release.json"))
          image=manifest["image"]["immutable_ref"]
          hook=(os.environ.get("RENDER_DEPLOY_HOOK_URL") or "").strip()
          if hook:
              sep="&" if "?" in hook else "?"
              url=hook + sep + urllib.parse.urlencode({"imgURL": image})
              request=urllib.request.Request(
                  url,
                  method="POST",
                  headers={"User-Agent":"OAP-Core-Deploy-Hook/1.0"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body=response.read(200000).decode("utf-8","replace")
                  if response.status not in (200, 202):
                      raise SystemExit(f"deploy_hook_http_{response.status}")
              print(json.dumps({
                  "path":"deploy_hook",
                  "service_id":manifest["service"]["render_service_id"],
                  "image":image,
                  "response":body[:1000],
              }, sort_keys=True))
          else:
              completed=subprocess.run(
                  [sys.executable, "scripts/promote_render_core_image.py", "--apply"],
                  check=False,
              )
              raise SystemExit(completed.returncode)
          PY

      - name: Verify exact image live, public health and public Link Up entry
        env:
          OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          manifest=json.load(open("deploy/render-core-release.json"))
          service_id=manifest["service"]["render_service_id"]
          expected_image=manifest["image"]["immutable_ref"]
          token=(os.environ.get("OAP_RENDER_API_KEY") or os.environ.get("RENDER_API_KEY") or "").strip()
          if not token:
              raise SystemExit("render_api_key_missing")
          api=f"https://api.render.com/v1/services/{service_id}/deploys?limit=10"
          headers={
              "Accept":"application/json",
              "Authorization":"Bearer "+token,
              "User-Agent":"OAP-Core-Postdeploy-Proof/1.0",
          }
          for _ in range(36):
              try:
                  with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=20) as r:
                      deploys=json.loads(r.read(500000).decode("utf-8"))
                  found=False
                  for item in deploys:
                      deploy=item.get("deploy", item) if isinstance(item, dict) else {}
                      image=deploy.get("image") if isinstance(deploy, dict) else None
                      if (
                          deploy.get("status")=="live"
                          and isinstance(image, dict)
                          and image.get("ref")==expected_image
                      ):
                          found=True
                          break
                  if found:
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit("exact_image_not_live")

          base=manifest["service"]["public_url"]
          for _ in range(18):
              try:
                  with urllib.request.urlopen(base+"/healthz", timeout=20) as r:
                      if 200 <= r.status < 300:
                          break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit("healthz_not_ready")
          with urllib.request.urlopen(base+"/linkup", timeout=20) as r:
              linkup=r.read().decode("utf-8","replace")
          assert "Create My Card" in linkup
          assert 'href="/my-card/create"' in linkup
          assert "Enter My World" not in linkup
          with urllib.request.urlopen(base+"/my-card/create", timeout=20) as r:
              create_card=r.read().decode("utf-8","replace")
          assert "Create My Card — Free" in create_card
          assert "Creating it is free." in create_card
          assert "Enter My World" not in create_card
          print("oap-core-image-promotion-acceptance-pass")
          PY
