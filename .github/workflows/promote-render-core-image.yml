name: Promote OAP Core immutable image

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROMOTE to apply the exact existing-service image promotion"
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    if: ${{ inputs.confirmation == 'PROMOTE' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v5

      - name: Verify immutable release contract
        run: |
          python - <<'PY'
          import json
          manifest=json.load(open("deploy/render-core-release.json"))
          assert manifest["service"]["render_service_id"] == "srv-d8gfsv0jo6nc73egdlf0"
          assert manifest["image"]["immutable_ref"] == (
              "ghcr.io/royalprince777/on-any-postcode-runtime@"
              "sha256:706fc5700049b0be2a7d7df2e755e5fe160c61c33dbc2d454d772fd6ddd519b6"
          )
          print("immutable-release-contract-ok")
          PY

      - name: Promote exact existing Core service image
        env:
          OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python scripts/promote_render_core_image.py --apply

      - name: Verify public health and public Link Up entry
        run: |
          python - <<'PY'
          import time, urllib.request
          base="https://on-any-postcode.onrender.com"
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base+"/healthz", timeout=20) as r:
                      if 200 <= r.status < 300:
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit("healthz_not_ready")
          with urllib.request.urlopen(base+"/linkup", timeout=20) as r:
              linkup=r.read().decode("utf-8","replace")
          assert "Create My Card" in linkup
          assert 'href="/my-card/create"' in linkup
          assert "Enter My World" not in linkup
          with urllib.request.urlopen(base+"/my-card/create", timeout=20) as r:
              create_card=r.read().decode("utf-8","replace")
          assert "Create My Card — Free" in create_card
          assert "Creating it is free." in create_card
          assert "Enter My World" not in create_card
          print("oap-core-image-promotion-acceptance-pass")
          PY
