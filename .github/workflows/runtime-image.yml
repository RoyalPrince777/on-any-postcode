name: OAP runtime image
# credential-bridge-recheck: 2026-09-28 secret-confirmed-rerun

on:
  pull_request:
    paths:
      - "Dockerfile.runtime"
      - "requirements.txt"
      - "app.py"
      - "gunicorn.conf.py"
      - "smi_gateway.py"
      - "mission_control/**"
      - "oap/**"
      - "templates/global_affairs.html"
      - ".github/workflows/runtime-image.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile.runtime"
      - "requirements.txt"
      - "app.py"
      - "gunicorn.conf.py"
      - "smi_gateway.py"
      - "mission_control/**"
      - "oap/**"
      - "templates/global_affairs.html"
      - ".github/workflows/runtime-image.yml"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  packages: write

concurrency:
  group: oap-production-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/royalprince777/on-any-postcode-runtime

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image for PR proof
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Core and SMI from the same image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm "${IMAGE_NAME}:${GITHUB_SHA}" python -c "import app; import smi_gateway; print('oap-runtime-imports-ok')"
          docker run --rm -e OAP_RUNTIME_TARGET=app:app "${IMAGE_NAME}:${GITHUB_SHA}" sh -c 'python -c "import app; assert hasattr(app, \"app\")"'
          docker run --rm -e OAP_RUNTIME_TARGET=smi_gateway:app "${IMAGE_NAME}:${GITHUB_SHA}" sh -c 'python -c "import smi_gateway; assert hasattr(smi_gateway, \"app\")"'

      - name: Build and publish exact runtime image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-core:
    if: github.event_name == 'push'
    needs: runtime-image
    runs-on: ubuntu-latest
    environment: production
    env:
      OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IMAGE_NAME: ghcr.io/royalprince777/on-any-postcode-runtime
      IMAGE_DIGEST: ${{ needs.runtime-image.outputs.digest }}
      IMAGE_TAG: ${{ github.sha }}
      SERVICE_ID: srv-d8gfsv0jo6nc73egdlf0
      SERVICE_NAME: on-any-postcode
      PUBLIC_URL: https://on-any-postcode.onrender.com
      HEALTH_PATH: /healthz
    steps:
      - name: Require current main release candidate
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test -n "$current" || { echo "current-main-readback-missing"; exit 1; }
          test "$current" = "$RELEASE_SHA" || { echo "release-superseded current=$current candidate=$RELEASE_SHA"; exit 1; }
          echo "release-current candidate=$RELEASE_SHA"

      - name: Report Core promotion unavailable
        if: env.OAP_RENDER_API_KEY == '' && env.RENDER_API_KEY == ''
        run: echo "core-promotion-skipped-render-api-key-not-configured"

      - name: Require governed checks for exact release SHA
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          repo=os.environ["REPOSITORY"]
          sha=os.environ["RELEASE_SHA"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs"
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":"Bearer "+token,
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"OAP-Release-Governed-Gate/1.0",
          }
          for _ in range(90):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              checks=data.get("check_runs") or []
              governed=[x for x in checks if x.get("name")=="test"]
              if any(x.get("status")=="completed" and x.get("conclusion")=="success" for x in governed):
                  print(json.dumps({"event":"governed_release_gate","sha":sha,"success":True},sort_keys=True))
                  break
              if any(x.get("status")=="completed" and x.get("conclusion") not in (None,"success","neutral","skipped") for x in governed):
                  raise SystemExit("governed_checks_failed_for_exact_sha")
              time.sleep(10)
          else:
              raise SystemExit("governed_checks_not_green_for_exact_sha")
          PY

      - name: Promote exact published image to existing Core service
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token=(os.environ.get("OAP_RENDER_API_KEY") or os.environ.get("RENDER_API_KEY") or "").strip()
          if not token:
              raise SystemExit("render_api_key_missing")
          digest=os.environ["IMAGE_DIGEST"].strip()
          if not digest.startswith("sha256:"):
              raise SystemExit("runtime_image_digest_missing")
          tag=os.environ["IMAGE_TAG"].strip()
          if not tag:
              raise SystemExit("runtime_image_tag_missing")
          image=f'{os.environ["IMAGE_NAME"]}@{digest}'
          service_id=os.environ["SERVICE_ID"]
          api="https://api.render.com/v1"

          def req(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(
                  api+path, data=body, method=method,
                  headers={
                      "Accept":"application/json",
                      "Authorization":"Bearer "+token,
                      "Content-Type":"application/json",
                      "User-Agent":"OAP-Core-Exact-Image-Promotion/1.0",
                  })
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read(512000)
              except urllib.error.HTTPError as exc:
                  detail=exc.read(4096).decode("utf-8","replace")
                  raise SystemExit(f"render_http_{exc.code}:{detail}")
              if not raw:
                  return {}
              data=json.loads(raw.decode())
              if not isinstance(data,dict):
                  raise SystemExit("invalid_render_response")
              return data

          current=req("GET",f"/services/{service_id}")
          if current.get("id")!=service_id or current.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("unexpected_service_identity")
          details=current.get("serviceDetails") or {}
          if details.get("url")!=os.environ["PUBLIC_URL"] or details.get("healthCheckPath")!=os.environ["HEALTH_PATH"]:
              raise SystemExit("unexpected_service_boundary")

          image_payload={
              "ownerId": current.get("ownerId"),
              "imagePath": image,
          }
          registry=current.get("registryCredential") or {}
          registry_id=registry.get("id") if isinstance(registry,dict) else None
          if registry_id:
              image_payload["registryCredentialId"]=registry_id
          if not image_payload["ownerId"]:
              raise SystemExit("service_owner_missing")

          updated=req("PATCH",f"/services/{service_id}",{"image":image_payload,"autoDeploy":"no"})
          if updated.get("id")!=service_id or updated.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("service_update_identity_mismatch")
          if updated.get("imagePath") != image:
              raise SystemExit("service_image_readback_mismatch")

          deploy=req("POST",f"/services/{service_id}/deploys",{"imageUrl":image})
          deploy_id=deploy.get("id") if isinstance(deploy,dict) else None
          if not deploy_id:
              # A successful Render deploy request can return no JSON receipt.
              # Health/read-back below remains the release gate.
              deploy_id="accepted-no-receipt"
          print(json.dumps({"service_id":service_id,"image":image,"deploy_id":deploy_id},sort_keys=True))
          PY

      - name: Verify Core health
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import time, urllib.request
          url="https://on-any-postcode.onrender.com/healthz"
          for _ in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=20) as response:
                      if 200 <= response.status < 300:
                          print("core-image-health-pass")
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit("core_image_health_not_ready")
          PY

  promote-smi:
    if: github.event_name == 'push'
    needs: [runtime-image, promote-core]
    runs-on: ubuntu-latest
    environment: production
    env:
      OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IMAGE_NAME: ghcr.io/royalprince777/on-any-postcode-runtime
      IMAGE_DIGEST: ${{ needs.runtime-image.outputs.digest }}
      IMAGE_TAG: ${{ github.sha }}
      SERVICE_ID: srv-da6tp615efls73ct81q0
      SERVICE_NAME: oap-smi
      PUBLIC_URL: https://oap-smi.onrender.com
      HEALTH_PATH: /healthz
    steps:
      - name: Require current main release candidate
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test -n "$current" || { echo "current-main-readback-missing"; exit 1; }
          test "$current" = "$RELEASE_SHA" || { echo "release-superseded current=$current candidate=$RELEASE_SHA"; exit 1; }
          echo "release-current candidate=$RELEASE_SHA"

      - name: Report SMI promotion unavailable
        if: env.OAP_RENDER_API_KEY == '' && env.RENDER_API_KEY == ''
        run: echo "smi-promotion-skipped-render-api-key-not-configured"

      - name: Promote exact published image to existing SMI service
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token=(os.environ.get("OAP_RENDER_API_KEY") or os.environ.get("RENDER_API_KEY") or "").strip()
          if not token:
              raise SystemExit("render_api_key_missing")
          digest=os.environ["IMAGE_DIGEST"].strip()
          if not digest.startswith("sha256:"):
              raise SystemExit("runtime_image_digest_missing")
          tag=os.environ["IMAGE_TAG"].strip()
          if not tag:
              raise SystemExit("runtime_image_tag_missing")
          image=f'{os.environ["IMAGE_NAME"]}@{digest}'
          service_id=os.environ["SERVICE_ID"]
          api="https://api.render.com/v1"

          def req(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(
                  api+path, data=body, method=method,
                  headers={
                      "Accept":"application/json",
                      "Authorization":"Bearer "+token,
                      "Content-Type":"application/json",
                      "User-Agent":"OAP-SMI-Exact-Image-Promotion/1.0",
                  })
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read(512000)
              except urllib.error.HTTPError as exc:
                  detail=exc.read(4096).decode("utf-8","replace")
                  raise SystemExit(f"render_http_{exc.code}:{detail}")
              if not raw:
                  return {}
              data=json.loads(raw.decode())
              if not isinstance(data,dict):
                  raise SystemExit("invalid_render_response")
              return data

          current=req("GET",f"/services/{service_id}")
          if current.get("id")!=service_id or current.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("unexpected_service_identity")
          details=current.get("serviceDetails") or {}
          if details.get("url")!=os.environ["PUBLIC_URL"] or details.get("healthCheckPath")!=os.environ["HEALTH_PATH"]:
              raise SystemExit("unexpected_service_boundary")

          image_payload={
              "ownerId": current.get("ownerId"),
              "imagePath": image,
          }
          registry=current.get("registryCredential") or {}
          registry_id=registry.get("id") if isinstance(registry,dict) else None
          if registry_id:
              image_payload["registryCredentialId"]=registry_id
          if not image_payload["ownerId"]:
              raise SystemExit("service_owner_missing")

          updated=req("PATCH",f"/services/{service_id}",{
              "repo":None,
              "branch":None,
              "image":image_payload,
              "autoDeploy":"no",
          })
          if updated.get("id")!=service_id or updated.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("service_update_identity_mismatch")
          if updated.get("imagePath") != image:
              raise SystemExit("service_image_readback_mismatch")

          deploy=req("POST",f"/services/{service_id}/deploys",{"imageUrl":image})
          deploy_id=deploy.get("id") if isinstance(deploy,dict) else None
          if not deploy_id:
              # A successful Render deploy request can return no JSON receipt.
              # Health/read-back below remains the release gate.
              deploy_id="accepted-no-receipt"
          print(json.dumps({"service_id":service_id,"image":image,"deploy_id":deploy_id},sort_keys=True))
          PY

      - name: Verify SMI health
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import time, urllib.request
          url="https://oap-smi.onrender.com/healthz"
          for _ in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=20) as response:
                      if 200 <= response.status < 300:
                          print("smi-image-health-pass")
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit("smi_image_health_not_ready")
          PY

  certify-production-release:
    if: github.event_name == 'push'
    needs: [runtime-image, promote-core, promote-smi]
    runs-on: ubuntu-latest
    environment: production
    env:
      OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IMAGE_NAME: ghcr.io/royalprince777/on-any-postcode-runtime
      IMAGE_DIGEST: ${{ needs.runtime-image.outputs.digest }}
      RELEASE_SHA: ${{ github.sha }}
      CORE_SERVICE_ID: srv-d8gfsv0jo6nc73egdlf0
      SMI_SERVICE_ID: srv-da6tp615efls73ct81q0
    steps:
      - name: Checkout exact certified commit
        uses: actions/checkout@v5

      - name: Verify exact production image binding
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          token=(os.environ.get("OAP_RENDER_API_KEY") or os.environ.get("RENDER_API_KEY") or "").strip()
          if not token:
              raise SystemExit("render_api_key_missing")
          digest=os.environ["IMAGE_DIGEST"].strip()
          image=f'{os.environ["IMAGE_NAME"]}@{digest}'
          api="https://api.render.com/v1"
          headers={"Accept":"application/json","Authorization":"Bearer "+token,"User-Agent":"OAP-Production-Certificate/1.0"}
          for service_id in (os.environ["CORE_SERVICE_ID"],os.environ["SMI_SERVICE_ID"]):
              for _ in range(36):
                  req=urllib.request.Request(api+f"/services/{service_id}",headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      service=json.load(r)
                  if service.get("imagePath")==image and (service.get("serviceDetails") or {}).get("runtime")=="image":
                      break
                  time.sleep(5)
              else:
                  raise SystemExit(f"production_image_binding_failed:{service_id}")
          print(json.dumps({"event":"production_image_binding","image":image,"sha":os.environ["RELEASE_SHA"],"success":True},sort_keys=True))
          PY

      - name: Verify live Core and SMI acceptance
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          probes=[
              ("core_health","https://on-any-postcode.onrender.com/healthz",{200}),
              ("smi_health","https://oap-smi.onrender.com/healthz",{200}),
              ("smi_auth","https://oap-smi.onrender.com/auth",{200}),
              ("smi_chat_status_private","https://oap-smi.onrender.com/mission/chat/status",{401}),
              ("smi_green_gate_private","https://oap-smi.onrender.com/mission/smi/green-gate",{401}),
              ("smi_war_room_private","https://oap-smi.onrender.com/mission/war-room/status",{401}),
              ("smi_organiser_private","https://oap-smi.onrender.com/mission/organiser",{200}),
              ("smi_organiser_api_private","https://oap-smi.onrender.com/api/smi-organiser/connectivity-briefs/11111111-1111-4111-8111-111111111111",{401}),
          ]
          receipt={}
          for name,url,allowed in probes:
              last=None
              for _ in range(24):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"OAP-Production-Certificate/1.0"})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          status=r.status
                      last=status
                      if status in allowed:
                          receipt[name]=status
                          break
                  except urllib.error.HTTPError as e:
                      last=e.code
                      if e.code in allowed:
                          receipt[name]=e.code
                          break
                  except Exception as e:
                      last=type(e).__name__
                  time.sleep(5)
              else:
                  raise SystemExit(f"live_acceptance_failed:{name}:{last}")
          print(json.dumps({"event":"production_live_acceptance","probes":receipt,"success":True},sort_keys=True))
          PY

      - name: Verify SMI interaction state machine
        run: |
          node --check mission_control/static/smi_live_character_state.js
          node --check mission_control/static/smi_canonical_controller.js
          node --check mission_control/static/smi_chat_final.js
          node --check mission_control/static/smi_interaction_layer.js
          node --check mission_control/static/smi_media_controls.js
          node tests/smi_live_character_state_test.cjs
          node tests/smi_live_character_exhaustive_test.cjs
          node tests/smi_exact_character_rig_foundation_test.cjs
          node tests/smi_source_pixel_motion_test.cjs
          node tests/smi_reply_audio_player_test.cjs
          node tests/smi_real_reply_motion_bridge_test.cjs

      - name: Issue exact release certificate
        run: |
          printf '{"release_sha":"%s","image_digest":"%s","core_service":"%s","smi_service":"%s","green":true}\n'             "$RELEASE_SHA" "$IMAGE_DIGEST" "$CORE_SERVICE_ID" "$SMI_SERVICE_ID" | tee /tmp/oap-production-release-certificate.json

      - name: Preserve release certificate
        uses: actions/upload-artifact@v4
        with:
          name: production-release-certificate-${{ github.sha }}
          path: /tmp/oap-production-release-certificate.json
          if-no-files-found: error
          retention-days: 30
