name: OAP runtime image
# credential-bridge-recheck: 2026-09-28 secret-confirmed-rerun

on:
  pull_request:
    paths:
      - "Dockerfile.runtime"
      - "requirements.txt"
      - "app.py"
      - "smi_gateway.py"
      - "mission_control/**"
      - "oap/**"
      - "templates/global_affairs.html"
      - ".github/workflows/runtime-image.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile.runtime"
      - "requirements.txt"
      - "app.py"
      - "smi_gateway.py"
      - "mission_control/**"
      - "oap/**"
      - "templates/global_affairs.html"
      - ".github/workflows/runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/royalprince777/on-any-postcode-runtime

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image for PR proof
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Core and SMI from the same image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm "${IMAGE_NAME}:${GITHUB_SHA}" python -c "import app; import smi_gateway; print('oap-runtime-imports-ok')"
          docker run --rm -e OAP_RUNTIME_TARGET=app:app "${IMAGE_NAME}:${GITHUB_SHA}" sh -c 'python -c "import app; assert hasattr(app, \"app\")"'
          docker run --rm -e OAP_RUNTIME_TARGET=smi_gateway:app "${IMAGE_NAME}:${GITHUB_SHA}" sh -c 'python -c "import smi_gateway; assert hasattr(smi_gateway, \"app\")"'

      - name: Build and publish exact runtime image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-core:
    if: github.event_name == 'push'
    needs: runtime-image
    runs-on: ubuntu-latest
    environment: production
    env:
      OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IMAGE_NAME: ghcr.io/royalprince777/on-any-postcode-runtime
      IMAGE_DIGEST: ${{ needs.runtime-image.outputs.digest }}
      IMAGE_TAG: ${{ github.sha }}
      SERVICE_ID: srv-d8gfsv0jo6nc73egdlf0
      SERVICE_NAME: on-any-postcode
      PUBLIC_URL: https://on-any-postcode.onrender.com
      HEALTH_PATH: /healthz
    steps:
      - name: Report Core promotion unavailable
        if: env.OAP_RENDER_API_KEY == '' && env.RENDER_API_KEY == ''
        run: echo "core-promotion-skipped-render-api-key-not-configured"

      - name: Promote exact published image to existing Core service
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token=(os.environ.get("OAP_RENDER_API_KEY") or os.environ.get("RENDER_API_KEY") or "").strip()
          if not token:
              raise SystemExit("render_api_key_missing")
          digest=os.environ["IMAGE_DIGEST"].strip()
          if not digest.startswith("sha256:"):
              raise SystemExit("runtime_image_digest_missing")
          tag=os.environ["IMAGE_TAG"].strip()
          if not tag:
              raise SystemExit("runtime_image_tag_missing")
          image=f'{os.environ["IMAGE_NAME"]}@{digest}'
          service_id=os.environ["SERVICE_ID"]
          api="https://api.render.com/v1"

          def req(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(
                  api+path, data=body, method=method,
                  headers={
                      "Accept":"application/json",
                      "Authorization":"Bearer "+token,
                      "Content-Type":"application/json",
                      "User-Agent":"OAP-Core-Exact-Image-Promotion/1.0",
                  })
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read(512000)
              except urllib.error.HTTPError as exc:
                  detail=exc.read(4096).decode("utf-8","replace")
                  raise SystemExit(f"render_http_{exc.code}:{detail}")
              if not raw:
                  return {}
              data=json.loads(raw.decode())
              if not isinstance(data,dict):
                  raise SystemExit("invalid_render_response")
              return data

          current=req("GET",f"/services/{service_id}")
          if current.get("id")!=service_id or current.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("unexpected_service_identity")
          details=current.get("serviceDetails") or {}
          if details.get("url")!=os.environ["PUBLIC_URL"] or details.get("healthCheckPath")!=os.environ["HEALTH_PATH"]:
              raise SystemExit("unexpected_service_boundary")

          image_payload={
              "ownerId": current.get("ownerId"),
              "imagePath": image,
          }
          registry=current.get("registryCredential") or {}
          registry_id=registry.get("id") if isinstance(registry,dict) else None
          if registry_id:
              image_payload["registryCredentialId"]=registry_id
          if not image_payload["ownerId"]:
              raise SystemExit("service_owner_missing")

          updated=req("PATCH",f"/services/{service_id}",{"image":image_payload,"autoDeploy":"no"})
          if updated.get("id")!=service_id or updated.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("service_update_identity_mismatch")
          if updated.get("imagePath") != image:
              raise SystemExit("service_image_readback_mismatch")

          deploy=req("POST",f"/services/{service_id}/deploys",{"imageUrl":image})
          deploy_id=deploy.get("id") if isinstance(deploy,dict) else None
          if not deploy_id:
              # A successful Render deploy request can return no JSON receipt.
              # Health/read-back below remains the release gate.
              deploy_id="accepted-no-receipt"
          print(json.dumps({"service_id":service_id,"image":image,"deploy_id":deploy_id},sort_keys=True))
          PY

      - name: Verify Core health
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import time, urllib.request
          url="https://on-any-postcode.onrender.com/healthz"
          for _ in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=20) as response:
                      if 200 <= response.status < 300:
                          print("core-image-health-pass")
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit("core_image_health_not_ready")
          PY

  promote-smi:
    if: github.event_name == 'push'
    needs: runtime-image
    runs-on: ubuntu-latest
    environment: production
    env:
      OAP_RENDER_API_KEY: ${{ secrets.OAP_RENDER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IMAGE_NAME: ghcr.io/royalprince777/on-any-postcode-runtime
      IMAGE_DIGEST: ${{ needs.runtime-image.outputs.digest }}
      IMAGE_TAG: ${{ github.sha }}
      SERVICE_ID: srv-da6tp615efls73ct81q0
      SERVICE_NAME: oap-smi
      PUBLIC_URL: https://oap-smi.onrender.com
      HEALTH_PATH: /healthz
    steps:
      - name: Report SMI promotion unavailable
        if: env.OAP_RENDER_API_KEY == '' && env.RENDER_API_KEY == ''
        run: echo "smi-promotion-skipped-render-api-key-not-configured"

      - name: Promote exact published image to existing SMI service
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token=(os.environ.get("OAP_RENDER_API_KEY") or os.environ.get("RENDER_API_KEY") or "").strip()
          if not token:
              raise SystemExit("render_api_key_missing")
          digest=os.environ["IMAGE_DIGEST"].strip()
          if not digest.startswith("sha256:"):
              raise SystemExit("runtime_image_digest_missing")
          tag=os.environ["IMAGE_TAG"].strip()
          if not tag:
              raise SystemExit("runtime_image_tag_missing")
          image=f'{os.environ["IMAGE_NAME"]}@{digest}'
          service_id=os.environ["SERVICE_ID"]
          api="https://api.render.com/v1"

          def req(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(
                  api+path, data=body, method=method,
                  headers={
                      "Accept":"application/json",
                      "Authorization":"Bearer "+token,
                      "Content-Type":"application/json",
                      "User-Agent":"OAP-SMI-Exact-Image-Promotion/1.0",
                  })
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read(512000)
              except urllib.error.HTTPError as exc:
                  detail=exc.read(4096).decode("utf-8","replace")
                  raise SystemExit(f"render_http_{exc.code}:{detail}")
              if not raw:
                  return {}
              data=json.loads(raw.decode())
              if not isinstance(data,dict):
                  raise SystemExit("invalid_render_response")
              return data

          current=req("GET",f"/services/{service_id}")
          if current.get("id")!=service_id or current.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("unexpected_service_identity")
          details=current.get("serviceDetails") or {}
          if details.get("url")!=os.environ["PUBLIC_URL"] or details.get("healthCheckPath")!=os.environ["HEALTH_PATH"]:
              raise SystemExit("unexpected_service_boundary")

          image_payload={
              "ownerId": current.get("ownerId"),
              "imagePath": image,
          }
          registry=current.get("registryCredential") or {}
          registry_id=registry.get("id") if isinstance(registry,dict) else None
          if registry_id:
              image_payload["registryCredentialId"]=registry_id
          if not image_payload["ownerId"]:
              raise SystemExit("service_owner_missing")

          updated=req("PATCH",f"/services/{service_id}",{
              "repo":None,
              "branch":None,
              "image":image_payload,
              "autoDeploy":"no",
          })
          if updated.get("id")!=service_id or updated.get("name")!=os.environ["SERVICE_NAME"]:
              raise SystemExit("service_update_identity_mismatch")
          if updated.get("imagePath") != image:
              raise SystemExit("service_image_readback_mismatch")

          deploy=req("POST",f"/services/{service_id}/deploys",{"imageUrl":image})
          deploy_id=deploy.get("id") if isinstance(deploy,dict) else None
          if not deploy_id:
              # A successful Render deploy request can return no JSON receipt.
              # Health/read-back below remains the release gate.
              deploy_id="accepted-no-receipt"
          print(json.dumps({"service_id":service_id,"image":image,"deploy_id":deploy_id},sort_keys=True))
          PY

      - name: Verify SMI health
        if: env.OAP_RENDER_API_KEY != '' || env.RENDER_API_KEY != ''
        run: |
          python - <<'PY'
          import time, urllib.request
          url="https://oap-smi.onrender.com/healthz"
          for _ in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=20) as response:
                      if 200 <= response.status < 300:
                          print("smi-image-health-pass")
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit("smi_image_health_not_ready")
          PY
