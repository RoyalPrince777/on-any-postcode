name: SMI Maps live truth proof

on:
  pull_request:
    paths:
      - ".github/workflows/smi-map-live-proof.yml"

permissions:
  contents: read

jobs:
  live-map-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live SMI Maps screen and APIs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "https://oap-smi.onrender.com"

          def get(path, timeout=25):
              req = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "OAP-SMI-Maps-Live-Proof/1.0"},
              )
              return urllib.request.urlopen(req, timeout=timeout)

          with get("/on-any-place") as response:
              body = response.read().decode("utf-8", "replace")
              assert response.status == 200, response.status
              assert "oap_map_navigation.js" in body, "navigation runtime missing"
              assert "/map-intelligence/" in body, "Map Intelligence API wiring missing"

          with get("/map-intelligence/places?q=Mitcham") as response:
              body = response.read().decode("utf-8", "replace")
              assert response.status == 200, response.status
              payload = json.loads(body)
              assert isinstance(payload, (dict, list)), type(payload).__name__

          try:
              get("/on-any-place/extra")
              raise AssertionError("unexpectedly opened non-allowlisted child path")
          except urllib.error.HTTPError as exc:
              assert exc.code == 404, exc.code

          print("SMI_MAP_LIVE_PROOF=PASS")
          PY
