name: OAP Arena real Chromium PostgreSQL acceptance

on:
  pull_request:
    paths:
      - "app.py"
      - "mission_control/templates/arena.html"
      - "templates/my_card.html"
      - "mission_control/arena_intelligence.py"
      - "mission_control/products.py"
      - "mission_control/connect4.py"
      - "mission_control/chess.py"
      - "mission_control/ludo.py"
      - "mission_control/dot.py"
      - "mission_control/oware.py"
      - "mission_control/route_empire.py"
      - "mission_control/iq_arena.py"
      - "static/connect4.js"
      - "static/chess.js"
      - "static/ludo.js"
      - "static/dot.js"
      - "static/oware.js"
      - "static/route_empire.js"
      - "static/iq_arena.js"
      - "mission_control/templates/connect4.html"
      - "mission_control/templates/chess.html"
      - "mission_control/templates/ludo.html"
      - "mission_control/templates/dot.html"
      - "mission_control/templates/oware.html"
      - "mission_control/templates/route_empire.html"
      - "mission_control/templates/iq_arena.html"
      - "tests/test_connect4.py"
      - "tests/test_chess.py"
      - "tests/test_ludo.py"
      - "tests/test_dot.py"
      - "tests/test_oware.py"
      - "tests/test_route_empire.py"
      - "tests/test_iq_arena.py"
      - "tests/test_arena_games_unified_ui.py"
      - "tests/test_arena_current_truth_alignment.py"
      - "tests/test_arena_remaining_games_http.py"
      - "tests/test_connect4_http.py"
      - "static/arena_connect4_room.js"
      - "static/arena_dot_room.js"
      - "mission_control/templates/arena_connect4_room.html"
      - "mission_control/templates/arena_dot_room.html"
      - "mission_control/arena_rooms.py"
      - "tests/arena_real_chromium_postgres_proof.py"
      - ".github/workflows/arena-chromium-proof.yml"

permissions:
  contents: read

jobs:
  arena-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oap_arena_browser_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oap_arena_browser_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OAP_PRIMARY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oap_arena_browser_ci
      OAP_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install actual runtime and Chromium
        run: |
          python -m pip install -r requirements.txt 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Real dual-browser Connect4 and Dot PostgreSQL proof
        run: python tests/arena_real_chromium_postgres_proof.py
