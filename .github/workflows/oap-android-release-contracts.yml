name: OAP Android Release Intelligence Contracts

on:
  push:
    branches: [feat/oap-home-launcher-foundation]
    paths:
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapApkDigest.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseMetadata.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseInput.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseDecision.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseAuthority.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapUpdateEligibility.java'
      - 'android/oapworld/src/test/java/com/onanypostcode/oapworld/*ContractTest.java'
      - '.github/workflows/oap-android-release-contracts.yml'
  pull_request:
    paths:
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapApkDigest.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseMetadata.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseInput.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseDecision.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapReleaseAuthority.java'
      - 'android/oapworld/src/main/java/com/onanypostcode/oapworld/OapUpdateEligibility.java'
      - 'android/oapworld/src/test/java/com/onanypostcode/oapworld/*ContractTest.java'
      - '.github/workflows/oap-android-release-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real release contracts
        shell: bash
        run: |
          set -euo pipefail
          source_dir=android/oapworld/src/main/java/com/onanypostcode/oapworld
          test_dir=android/oapworld/src/test/java/com/onanypostcode/oapworld
          mkdir -p "$RUNNER_TEMP/oap-release-contracts"
          javac -d "$RUNNER_TEMP/oap-release-contracts" \
            "$source_dir/OapUpdateEligibility.java" \
            "$source_dir/OapReleaseMetadata.java" \
            "$source_dir/OapReleaseInput.java" \
            "$source_dir/OapReleaseDecision.java" \
            "$source_dir/OapReleaseAuthority.java" \
            "$source_dir/OapApkDigest.java" \
            "$test_dir/OapUpdateEligibilityContractTest.java" \
            "$test_dir/OapReleaseMetadataContractTest.java" \
            "$test_dir/OapApkDigestContractTest.java" \
            "$test_dir/OapReleaseInputContractTest.java" \
            "$test_dir/OapReleaseDecisionContractTest.java" \
            "$test_dir/OapReleaseAuthorityContractTest.java"
      - name: Execute release contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test in OapUpdateEligibilityContractTest OapReleaseMetadataContractTest OapApkDigestContractTest OapReleaseInputContractTest OapReleaseDecisionContractTest OapReleaseAuthorityContractTest; do
            java -cp "$RUNNER_TEMP/oap-release-contracts" "com.onanypostcode.oapworld.$test"
          done
