name: OAP Home V2 native royal source acceptance
on:
  push:
    branches:
      - feature/oap-home-v2-native-royal-20261025
    paths:
      - android/oaphome/**
      - tests/test_oap_home_v2_native_royal.py
      - tests/test_oap_home_v2_inplace_gate.py
      - scripts/oap_home_v2_inplace_apk_gate.py
      - .github/workflows/oap-home-v2-native-royal.yml
  pull_request:
    branches:
      - oap-home-apk-master777
    paths:
      - android/oaphome/**
      - tests/test_oap_home_v2_native_royal.py
      - tests/test_oap_home_v2_inplace_gate.py
      - scripts/oap_home_v2_inplace_apk_gate.py
      - .github/workflows/oap-home-v2-native-royal.yml
permissions:
  contents: read
jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove existing V2 identity and old Home separation
        run: |
          python3 tests/test_oap_home_v2_native_royal.py
          python3 -m unittest discover -s tests -p 'test_oap_home_v2_inplace_gate.py' -v
          grep -Fq "applicationId 'com.onanypostcode.oaphome.v2'" android/oaphome/build.gradle
          grep -Fq 'android:label="OAP Home"' android/oaphome/src/main/AndroidManifest.xml
          if grep -Fxq "        applicationId 'com.onanypostcode.oaphome'" android/oaphome/build.gradle; then
            echo "::error::Original Home package must NOT replace the established V2 app"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile exact native Android branch source (no APK release)
        working-directory: android/oaphome
        run: gradle --no-daemon --stacktrace compileDebugJavaWithJavac
      - name: Prove no APK installed or published
        run: |
          echo "Native-source compile only; physical phone, launcher role, APK signature, and OAP OS are NOT VERIFIED."
