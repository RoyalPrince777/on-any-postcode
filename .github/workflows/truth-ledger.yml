name: Truth Ledger

on:
  pull_request:
    paths:
      - "deploy/oap-truth-ledger.json"
      - "scripts/validate_truth_ledger.py"
      - "tests/test_truth_ledger.py"
      - ".github/workflows/truth-ledger.yml"
  push:
    branches: [main]
    paths:
      - "deploy/oap-truth-ledger.json"
      - "scripts/validate_truth_ledger.py"
      - "tests/test_truth_ledger.py"
      - ".github/workflows/truth-ledger.yml"

permissions:
  contents: read

jobs:
  truth-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate canonical truth ledger
        run: python scripts/validate_truth_ledger.py
      - name: Run truth-mode tests
        run: python -m pytest -q tests/test_truth_ledger.py tests/test_release_preflight.py
