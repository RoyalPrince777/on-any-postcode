name: Fix baseline Ruff lint debt

on:
  push:
    branches:
      - build/smi-self-model-coherence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build/smi-self-model-coherence
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Apply safe Ruff fixes to flagged files
        run: |
          ruff check app.py mission_control/location_intelligence.py mission_control/product_store.py mission_control/workspaces.py --fix
          git diff --check
      - name: Commit lint-only fixes
        run: |
          if git diff --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py mission_control/location_intelligence.py mission_control/product_store.py mission_control/workspaces.py
          git commit -m "Fix baseline Ruff lint debt"
          git push origin HEAD:build/smi-self-model-coherence
