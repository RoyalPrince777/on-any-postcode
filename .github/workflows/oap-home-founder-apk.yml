name: OAP Home Founder APK
on:
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'android/oaphome/**'
      - 'android/oapworld/src/main/**'
      - '.github/workflows/oap-home-founder-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build separate Home APK
        run: gradle :android:oaphome:assembleDebug --no-daemon
      - name: Verify APK identity and signature
        run: |
          APK=android/oaphome/build/outputs/apk/debug/oaphome-debug.apk
          aapt dump badging "$APK" | grep "package: name='com.onanypostcode.oaphome'"
          apksigner verify --verbose "$APK"
          sha256sum "$APK" > oaphome-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: oap-home-founder-debug-apk
          path: |
            android/oaphome/build/outputs/apk/debug/oaphome-debug.apk
            oaphome-debug.apk.sha256
          if-no-files-found: error
