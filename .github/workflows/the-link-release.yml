name: THE LINK Android Production Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 0.1.0
        required: true
        type: string
      version_code:
        description: Monotonic Android version code
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require signing secrets
        env:
          KS_B64: ${{ secrets.THE_LINK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.THE_LINK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THE_LINK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.THE_LINK_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
      - name: Set release version
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '${{ inputs.version }}'/" android/app/build.gradle
      - name: Build unsigned release APK
        run: gradle -p android assembleRelease
      - name: Restore signing key in runner only
        env:
          KS_B64: ${{ secrets.THE_LINK_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 --decode > release.jks
      - name: Locate apksigner
        run: echo "APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Sign production APK
        env:
          KS_PASS: ${{ secrets.THE_LINK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THE_LINK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.THE_LINK_KEY_PASSWORD }}
        run: |
          "$APKSIGNER" sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out the-link-${{ inputs.version }}.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify signed APK
        run: |
          "$APKSIGNER" verify --verbose --print-certs the-link-${{ inputs.version }}.apk
          sha256sum the-link-${{ inputs.version }}.apk > the-link-${{ inputs.version }}.apk.sha256
      - name: Remove signing key
        if: always()
        run: rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: the-link-${{ inputs.version }}-signed
          path: |
            the-link-${{ inputs.version }}.apk
            the-link-${{ inputs.version }}.apk.sha256
          retention-days: 90
