name: OAP Transport real Chromium acceptance

on:
  pull_request:
    paths:
      - "app.py"
      - "mission_control/global_transport_views.py"
      - "mission_control/oap_ride_dashboards.py"
      - "mission_control/oap_ride_journey_views.py"
      - "mission_control/oap_ride_runtime_routes.py"
      - "mission_control/oap_ride_guardian_routes.py"
      - "mission_control/oap_ride_earnings_routes.py"
      - "mission_control/oap_ride_commercial_routes.py"
      - "mission_control/oap_ride_payment_bridge_routes.py"
      - "mission_control/oap_ride_driver_accessibility_routes.py"
      - "mission_control/oap_ride_ops_routes.py"
      - "mission_control/travel_transport_views.py"
      - "mission_control/journey_engine.py"
      - "static/oap-os.js"
      - "tests/transport_real_chromium_proof.py"
      - ".github/workflows/transport-chromium-proof.yml"

permissions:
  contents: read

jobs:
  transport-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OAP_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install actual runtime and Chromium
        run: |
          python -m pip install -r requirements.txt 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Prove Transport front door and dashboard button routes
        run: python tests/transport_real_chromium_proof.py
