name: Temporary Movement workspace live proof

on:
  push:
    branches:
      - build/movement-operational-workspace

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Movement workspace production boundary
        run: |
          set -euo pipefail
          base='https://on-any-postcode.onrender.com'
          movement_code=$(curl --silent --show-error --max-time 30 --output /tmp/movement.html --write-out '%{http_code}' "$base/movement")
          workspace_code=$(curl --silent --show-error --max-time 30 --output /tmp/workspace.html --dump-header /tmp/workspace.headers --write-out '%{http_code}' "$base/movement/workspace")
          status_code=$(curl --silent --show-error --max-time 30 --output /tmp/status.json --write-out '%{http_code}' "$base/movement/status")
          booking_code=$(curl --silent --show-error --max-time 30 --output /tmp/booking.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$base/movement/bookings")
          mission_code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$base/mission")
          echo "movement=$movement_code workspace=$workspace_code status=$status_code booking=$booking_code mission=$mission_code"
          test "$movement_code" = '200'
          test "$workspace_code" = '302'
          test "$status_code" = '200'
          test "$booking_code" = '401'
          test "$mission_code" = '404'
          grep -Fq 'My Movement' /tmp/movement.html
          grep -Fq 'href="/movement/workspace"' /tmp/movement.html
          grep -Eiq '^location: /enter-my-world\?next=(/|%2F)movement(/|%2F)workspace' /tmp/workspace.headers
          python - <<'PY'
          import json
          with open('/tmp/status.json', encoding='utf-8') as f:
              status=json.load(f)
          assert status['routing_adapter_configured'] is True, status
          assert status['routing_runtime_verified'] is True, status
          assert status['external_dispatch_enabled'] is False, status
          assert status['payment_capture_enabled'] is False, status
          assert status['esim_activation_enabled'] is False, status
          with open('/tmp/booking.json', encoding='utf-8') as f:
              booking=json.load(f)
          assert booking['error']['code'] == 'authentication_required', booking
          print('movement_workspace_live_proof=PASS')
          PY
