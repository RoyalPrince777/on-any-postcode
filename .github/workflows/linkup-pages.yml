name: Link Up GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/linkup/**"
      - ".github/workflows/linkup-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: linkup-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Link Up site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/linkup
      - name: Deploy Link Up
        id: deployment
        uses: actions/deploy-pages@v4
