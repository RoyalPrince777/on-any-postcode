name: OAP governed checks

on:
  pull_request:
  push:
    branches:
      - main
      - organism-canonical-78

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime and verification dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Install RTL simulator
        run: |
          if ! command -v iverilog >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y iverilog
          fi
      - name: Verify Live SMI browser state machine
        run: |
          node --check mission_control/static/smi_live_character_state.js
          node --check mission_control/static/smi_canonical_controller.js
          node --check mission_control/static/smi_chat_final.js
          node --check mission_control/static/smi_interaction_layer.js
          node tests/smi_live_character_state_test.cjs
          node tests/smi_live_character_exhaustive_test.cjs
          node --check mission_control/static/smi_exact_character_rig.js
          node tests/smi_exact_character_rig_foundation_test.cjs
          node --check mission_control/smi_character_motion_candidate.js
          node tests/smi_character_motion_candidate_test.cjs
          node --check mission_control/smi_android_motion_evidence_gate.js
          node tests/smi_android_motion_evidence_gate_test.cjs
          node --check mission_control/smi_real_reply_motion_bridge.js
          node tests/smi_real_reply_motion_bridge_test.cjs
      - name: Compile active Python packages
        run: python -m compileall -q app.py mission_control oap
      - name: Lint active application code
        run: ruff check app.py mission_control oap tests
      - name: Run OAP RTL proof slice
        run: |
          iverilog -g2012 -Wall -s tb_oap_guardian_nexus_slice \
            -o /tmp/oap-rtl-proof \
            rtl/oap_guardian_nexus_slice.sv \
            rtl/tb_oap_guardian_nexus_slice.sv
          vvp /tmp/oap-rtl-proof | tee /tmp/oap-rtl-proof.log
          grep -q "OAP_RTL_PROOF_SLICE_V0_PASS" /tmp/oap-rtl-proof.log
      - name: Run OAP RTL memory guard proof
        run: |
          iverilog -g2012 -Wall -s tb_oap_memory_guard_slice \
            -o /tmp/oap-rtl-memory-guard \
            rtl/oap_memory_guard_slice.sv \
            rtl/tb_oap_memory_guard_slice.sv
          vvp /tmp/oap-rtl-memory-guard | tee /tmp/oap-rtl-memory-guard.log
          grep -q "OAP_RTL_MEMORY_GUARD_V0_PASS" /tmp/oap-rtl-memory-guard.log
      - name: Run OAP RTL trust attestation proof
        run: |
          iverilog -g2012 -Wall -s tb_oap_trust_attestation_core \
            -o /tmp/oap-rtl-attestation \
            rtl/oap_trust_attestation_core.sv \
            rtl/tb_oap_trust_attestation_core.sv
          vvp /tmp/oap-rtl-attestation | tee /tmp/oap-rtl-attestation.log
          grep -q "OAP_RTL_ATTESTATION_V0_PASS" /tmp/oap-rtl-attestation.log
      # The external routing service is a hard gate, but an outage must not
      # suppress unrelated recovery regression evidence.
      - name: Run governed regression suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/oap-pytest.log
      - name: Run bounded external live routing Green Gate probe
        run: python scripts/routing_live_green_gate.py
      - name: Preserve regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-regression-report
          path: /tmp/oap-pytest.log
          if-no-files-found: error
          retention-days: 1
