name: OAP governed checks

on:
  pull_request:
  push:
    branches:
      - main
      - organism-canonical-78

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oap_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime and verification dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Install RTL simulator
        run: |
          if ! command -v iverilog >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y iverilog
          fi
      - name: Verify Live SMI browser state machine
        run: |
          node --check mission_control/static/smi_live_character_state.js
          node --check mission_control/static/smi_canonical_controller.js
          node --check mission_control/static/smi_chat_final.js
          node --check mission_control/static/smi_interaction_layer.js
          node --check mission_control/static/smi_media_controls.js
          node tests/smi_live_character_state_test.cjs
          node tests/smi_live_character_exhaustive_test.cjs
          node --check mission_control/static/smi_exact_character_rig.js
          node tests/smi_exact_character_rig_foundation_test.cjs
          node --check mission_control/static/smi_source_pixel_motion.js
          node tests/smi_source_pixel_motion_test.cjs
          node --check mission_control/static/smi_reply_audio_player.js
          node tests/smi_reply_audio_player_test.cjs
          node --check mission_control/smi_character_motion_candidate.js
          node tests/smi_character_motion_candidate_test.cjs
          node --check mission_control/smi_android_motion_evidence_gate.js
          node tests/smi_android_motion_evidence_gate_test.cjs
          node --check mission_control/smi_real_reply_motion_bridge.js
          node tests/smi_real_reply_motion_bridge_test.cjs
      - name: Validate first-party Arena browser controllers
        run: |
          for script in \
            static/arena_intelligence.js \
            static/earth_is_our_turf.js \
            static/route_empire.js \
            static/iq_arena.js \
            static/ludo.js \
            static/oware.js \
            static/chess.js \
            static/dot.js \
            static/connect4.js \
            static/arena_connect4_room.js \
            static/arena_dot_room.js; do
            node --check "$script"
          done
      - name: Compile active Python packages
        run: python -m compileall -q app.py mission_control oap
      - name: Validate OAP-hosted OSRM configuration without deployment
        run: |
          set -euo pipefail
          if OAP_ROUTING_HOST= docker compose -f routing/oap-host.compose.yml config >/tmp/oap-routing-missing-host.log 2>&1; then
            echo "OAP routing bundle accepted a missing hostname" >&2
            exit 1
          fi
          OAP_ROUTING_HOST=routing.oap.invalid docker compose -f routing/oap-host.compose.yml config --format json >/tmp/oap-routing-compose.json
          python - <<'PY'
          import json
          with open('/tmp/oap-routing-compose.json') as f:
              services = json.load(f)['services']
          assert not services['osrm'].get('ports'), 'OSRM must remain private'
          assert {str(p['target']) for p in services['gateway']['ports']} == {'80', '443'}
          PY
          docker run --rm --entrypoint caddy -e OAP_ROUTING_HOST=routing.oap.invalid \
            -v "$PWD/routing/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate OAP Home signing helper shell syntax
        run: bash -n scripts/oap_home_signing_setup.sh
      - name: Run focused OAP Data security regressions
        run: |
          set -o pipefail
          python -m pytest -q tests/test_oap_data_product.py 2>&1 | tee /tmp/oap-pytest.log
      - name: Lint active application code
        run: ruff check app.py mission_control oap tests
      - name: Run OAP RTL proof slice
        run: |
          iverilog -g2012 -Wall -s tb_oap_guardian_nexus_slice \
            -o /tmp/oap-rtl-proof \
            rtl/oap_guardian_nexus_slice.sv \
            rtl/tb_oap_guardian_nexus_slice.sv
          vvp /tmp/oap-rtl-proof | tee /tmp/oap-rtl-proof.log
          grep -q "OAP_RTL_PROOF_SLICE_V0_PASS" /tmp/oap-rtl-proof.log
      - name: Run OAP RTL memory guard proof
        run: |
          iverilog -g2012 -Wall -s tb_oap_memory_guard_slice \
            -o /tmp/oap-rtl-memory-guard \
            rtl/oap_memory_guard_slice.sv \
            rtl/tb_oap_memory_guard_slice.sv
          vvp /tmp/oap-rtl-memory-guard | tee /tmp/oap-rtl-memory-guard.log
          grep -q "OAP_RTL_MEMORY_GUARD_V0_PASS" /tmp/oap-rtl-memory-guard.log
      - name: Run OAP RTL trust attestation proof
        run: |
          iverilog -g2012 -Wall -s tb_oap_trust_attestation_core \
            -o /tmp/oap-rtl-attestation \
            rtl/oap_trust_attestation_core.sv \
            rtl/tb_oap_trust_attestation_core.sv
          vvp /tmp/oap-rtl-attestation | tee /tmp/oap-rtl-attestation.log
          grep -q "OAP_RTL_ATTESTATION_V0_PASS" /tmp/oap-rtl-attestation.log
      - name: Prove PR against current main without merging
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! tree="$(git merge-tree --write-tree HEAD origin/main)"; then
            echo "Combined-main merge conflicts:"
            git merge-tree HEAD origin/main || true
            exit 1
          fi
          combined="$(printf '%s\n' 'OAP ephemeral combined-main proof' | git -c user.name='OAP CI' -c user.email='ci@localhost' commit-tree "$tree" -p HEAD -p origin/main)"
          git worktree add --detach /tmp/oap-combined-main "$combined"
          cd /tmp/oap-combined-main
          for script in static/arena_intelligence.js static/earth_is_our_turf.js static/route_empire.js \
            static/iq_arena.js static/ludo.js static/chess.js static/dot.js \
            static/connect4.js static/arena_connect4_room.js \
            static/arena_dot_room.js; do node --check "$script"; done
          python -m compileall -q app.py mission_control oap
          ruff check app.py mission_control oap tests
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/oap-pytest.log

      # Preserve software regression evidence; the separate routing-live-ready
      # job remains a blocking operational check for exact-SHA promotion.
      - name: Run governed regression suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/oap-pytest.log
      - name: Run real Distribution × Market PostgreSQL proof
        env:
          OAP_PRIMARY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oap_ci
          OAP_REAL_POSTGRES_PROOF: "1"
        run: python -m pytest -q tests/test_distribution_market_postgres_integration.py tests/test_all_in_ai_postgres_executor_integration.py
      - name: Observe bounded external live weather proof
        continue-on-error: true
        run: python scripts/weather_live_green_gate.py
      - name: Preserve regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-regression-report
          path: /tmp/oap-pytest.log
          if-no-files-found: error
          retention-days: 1

  routing-live-ready:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prove explicit OAP-hosted live routing readiness
        env:
          OAP_ROUTING_BASE_URL: ${{ vars.OAP_ROUTING_BASE_URL }}
        run: |
          set -o pipefail
          python scripts/routing_live_green_gate.py | tee /tmp/oap-routing-live-proof.jsonl
      - name: Preserve routing readiness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-live-readiness-receipt
          path: /tmp/oap-routing-live-proof.jsonl
          if-no-files-found: error
          retention-days: 7
