name: OAP governed checks

on:
  pull_request:
  push:
    branches:
      - main
      - organism-canonical-78

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime and verification dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Install RTL simulator
        run: |
          if ! command -v iverilog >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y iverilog
          fi
      - name: Verify Live SMI browser state machine
        run: |
          node --check mission_control/static/smi_live_character_state.js
          node --check mission_control/static/smi_canonical_controller.js
          node --check mission_control/static/smi_chat_final.js
          node --check mission_control/static/smi_interaction_layer.js
          node tests/smi_live_character_state_test.cjs
          node tests/smi_live_character_exhaustive_test.cjs
          node --check mission_control/static/smi_exact_character_rig.js
          node tests/smi_exact_character_rig_foundation_test.cjs
          node --check mission_control/static/smi_source_pixel_motion.js
          node tests/smi_source_pixel_motion_test.cjs
          node --check mission_control/static/smi_reply_audio_player.js
          node tests/smi_reply_audio_player_test.cjs
          node --check mission_control/smi_character_motion_candidate.js
          node tests/smi_character_motion_candidate_test.cjs
          node --check mission_control/smi_android_motion_evidence_gate.js
          node tests/smi_android_motion_evidence_gate_test.cjs
          node --check mission_control/smi_real_reply_motion_bridge.js
          node tests/smi_real_reply_motion_bridge_test.cjs
      - name: Compile active Python packages
        run: python -m compileall -q app.py mission_control oap
      - name: Lint active application code
        run: ruff check app.py mission_control oap tests
      - name: Run OAP RTL proof slice
        run: |
          iverilog -g2012 -Wall -s tb_oap_guardian_nexus_slice \
            -o /tmp/oap-rtl-proof \
            rtl/oap_guardian_nexus_slice.sv \
            rtl/tb_oap_guardian_nexus_slice.sv
          vvp /tmp/oap-rtl-proof | tee /tmp/oap-rtl-proof.log
          grep -q "OAP_RTL_PROOF_SLICE_V0_PASS" /tmp/oap-rtl-proof.log
      - name: Run OAP RTL memory guard proof
        run: |
          iverilog -g2012 -Wall -s tb_oap_memory_guard_slice \
            -o /tmp/oap-rtl-memory-guard \
            rtl/oap_memory_guard_slice.sv \
            rtl/tb_oap_memory_guard_slice.sv
          vvp /tmp/oap-rtl-memory-guard | tee /tmp/oap-rtl-memory-guard.log
          grep -q "OAP_RTL_MEMORY_GUARD_V0_PASS" /tmp/oap-rtl-memory-guard.log
      - name: Run OAP RTL trust attestation proof
        run: |
          iverilog -g2012 -Wall -s tb_oap_trust_attestation_core \
            -o /tmp/oap-rtl-attestation \
            rtl/oap_trust_attestation_core.sv \
            rtl/tb_oap_trust_attestation_core.sv
          vvp /tmp/oap-rtl-attestation | tee /tmp/oap-rtl-attestation.log
          grep -q "OAP_RTL_ATTESTATION_V0_PASS" /tmp/oap-rtl-attestation.log
      - name: Prove PR against current main without merging
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! tree="$(git merge-tree --write-tree HEAD origin/main)"; then
            echo "Combined-main merge conflicts:"
            git merge-tree HEAD origin/main || true
            exit 1
          fi
          combined="$(printf '%s\n' 'OAP ephemeral combined-main proof' | git -c user.name='OAP CI' -c user.email='ci@localhost' commit-tree "$tree" -p HEAD -p origin/main)"
          git worktree add --detach /tmp/oap-combined-main "$combined"
          cd /tmp/oap-combined-main
          python -m compileall -q app.py mission_control oap
          ruff check app.py mission_control oap tests
          python -m pytest -q

      # The external routing service is a hard gate, but an outage must not
      # suppress unrelated recovery regression evidence.
      - name: Run governed regression suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/oap-pytest.log
      - name: Run bounded external live routing Green Gate probe
        run: python scripts/routing_live_green_gate.py
      - name: Preserve regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-regression-report
          path: /tmp/oap-pytest.log
          if-no-files-found: error
          retention-days: 1


  mail_recovery_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oap
          POSTGRES_PASSWORD: oap-ci-only
          POSTGRES_DB: oap_mail_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oap -d oap_mail_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: oap
      PGPASSWORD: oap-ci-only
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create synthetic owner-scoped Mail source and backup
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d oap_mail_source <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE users (
            id UUID PRIMARY KEY,
            username TEXT NOT NULL UNIQUE
          );
          INSERT INTO users(id,username)
          VALUES ('11111111-1111-4111-8111-111111111111','mail-proof-owner');
          \i migrations/0006_oap_mail_items.sql
          INSERT INTO oap_mail_items(
            owner_id,folder,subject,body,correspondent
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'draft','Recovery proof','Synthetic body','proof@example.test'
          );
          SQL
          source_digest="$(psql -At -d oap_mail_source -c             "SELECT md5(string_agg(owner_id::text || '|' || folder || '|' || subject || '|' || body || '|' || correspondent, E'\\n' ORDER BY id)) FROM oap_mail_items")"
          test -n "$source_digest"
          pg_dump --format=custom --file=/tmp/oap-mail-recovery.dump oap_mail_source
          dump_sha256="$(sha256sum /tmp/oap-mail-recovery.dump | awk '{print $1}')"
          test "${#dump_sha256}" -eq 64
          printf 'source_digest=%s\ndump_sha256=%s\n'             "$source_digest" "$dump_sha256" > /tmp/oap-mail-recovery-source.txt
      - name: Restore into fresh database and read back
        run: |
          set -euo pipefail
          createdb oap_mail_restore
          pg_restore --exit-on-error --no-owner --dbname=oap_mail_restore             /tmp/oap-mail-recovery.dump
          source_digest="$(sed -n 's/^source_digest=//p' /tmp/oap-mail-recovery-source.txt)"
          restored_digest="$(psql -At -d oap_mail_restore -c             "SELECT md5(string_agg(owner_id::text || '|' || folder || '|' || subject || '|' || body || '|' || correspondent, E'\\n' ORDER BY id)) FROM oap_mail_items")"
          test "$source_digest" = "$restored_digest"
          test "$(psql -At -d oap_mail_restore -c             "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='oap_mail_items' AND column_name IN ('id','owner_id','folder','subject','body','correspondent','created_at','updated_at')")" = "8"
          test "$(psql -At -d oap_mail_restore -c             "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname='idx_oap_mail_owner_folder_created' AND lower(indexdef) LIKE '%(owner_id, folder, created_at desc)%'")" = "1"
          test "$(psql -At -d oap_mail_restore -c             "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON c.conrelid=t.oid JOIN pg_namespace n ON t.relnamespace=n.oid WHERE n.nspname='public' AND t.relname='oap_mail_items' AND c.contype='f' AND lower(pg_get_constraintdef(c.oid)) LIKE 'foreign key (owner_id) references users(id) on delete cascade'")" = "1"
          test "$(psql -At -d oap_mail_restore -c             "SELECT count(*) FROM oap_mail_items WHERE owner_id='11111111-1111-4111-8111-111111111111' AND folder='draft' AND subject='Recovery proof'")" = "1"
          dump_sha256="$(sed -n 's/^dump_sha256=//p' /tmp/oap-mail-recovery-source.txt)"
          printf 'proof=OAP_MAIL_ISOLATED_RECOVERY_PASS\ndump_sha256=%s\nsource_digest=%s\nrestored_digest=%s\nproduction_database_used=false\n'             "$dump_sha256" "$source_digest" "$restored_digest"             > /tmp/oap-mail-recovery-proof.txt
          grep -q '^proof=OAP_MAIL_ISOLATED_RECOVERY_PASS$' /tmp/oap-mail-recovery-proof.txt
      - name: Preserve synthetic Mail recovery proof
        uses: actions/upload-artifact@v4
        with:
          name: oap-mail-isolated-recovery-proof
          path: /tmp/oap-mail-recovery-proof.txt
          if-no-files-found: error
          retention-days: 1
