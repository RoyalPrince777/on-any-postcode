name: THE LINK Android
on:
  push:
    branches: [ownpost-store-live]
    paths:
      - 'android/**'
      - '.github/workflows/the-link-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: the-link-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
