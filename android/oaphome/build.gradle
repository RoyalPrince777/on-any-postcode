plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.onanypostcode.oaphome'
    compileSdk 35

    // Same package as the installed original OAP Home. This is an in-place
    // update identity, NOT a second com.onanypostcode.oaphome.v2 application.
    // Signing must still match the currently installed original APK.
    defaultConfig {
        applicationId 'com.onanypostcode.oaphome'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '2.0.0-founder-inplace'
    }

    signingConfigs {
        oapPersistent {
            def keyPath = System.getenv('OAP_HOME_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storeType 'pkcs12'
                storePassword System.getenv('OAP_HOME_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OAP_HOME_KEY_ALIAS')
                keyPassword System.getenv('OAP_HOME_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.oapPersistent
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
