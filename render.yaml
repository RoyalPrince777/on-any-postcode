services:
  - type: web
    name: oap-smi
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    image:
      url: ghcr.io/royalprince777/on-any-postcode-runtime@sha256:31e1a236c954811cb00868897c614a5b655a8b2cfb9c844f4e80d6c231453d8a
    healthCheckPath: /healthz
    envVars:
      - key: OAP_RUNTIME_TARGET
        value: "smi_gateway:app"
      - key: OAP_PUBLIC_ORIGIN
        value: "https://on-any-postcode.onrender.com"
      - key: OAP_SURFACE_ROLE
        value: "private-gateway"
      - key: DATABASE_URL
        fromDatabase:
          name: oap-smi-hrm-fallback
          property: connectionString
      - key: OAP_SMI_GATEWAY_SECRET
        sync: false

  - type: web
    name: on-any-postcode
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    image:
      url: ghcr.io/royalprince777/on-any-postcode-runtime@sha256:31e1a236c954811cb00868897c614a5b655a8b2cfb9c844f4e80d6c231453d8a
    healthCheckPath: /healthz
    envVars:
      - key: OAP_RUNTIME_TARGET
        value: "app:app"
      - key: DATABASE_URL
        fromDatabase:
          name: oap-smi-hrm-fallback
          property: connectionString
      - key: OAP_LAB_DATABASE_AUTHORITY
        value: "platform_database_url"
      - key: OAP_LAB_IMMUTABILITY_MIGRATION_ON_BOOT
        value: "1"
      - key: OAP_LAB_RECOVERY_PROOF_ON_BOOT
        value: "1"
      - key: OAP_LIBRARY_LEARNING_MIGRATION_ON_BOOT
        value: "1"
      - key: OAP_LIBRARY_LEARNING_PROOF_ON_BOOT
        value: "1"
