services:
  - type: web
    name: oap-smi
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    image:
      url: ghcr.io/royalprince777/on-any-postcode-runtime@sha256:e23632e68641d7bdf8bc6f1e23596336537aec4cf101a748b229acddd70d8622
    healthCheckPath: /healthz
    envVars:
      - key: OAP_RUNTIME_TARGET
        value: "smi_gateway:app"
      - key: OAP_PUBLIC_ORIGIN
        value: "https://on-any-postcode.onrender.com"
      - key: OAP_SURFACE_ROLE
        value: "private-gateway"
      - key: DATABASE_URL
        fromDatabase:
          name: oap-smi-hrm-fallback
          property: connectionString
      - key: OAP_SMI_GATEWAY_SECRET
        sync: false

  - type: web
    name: on-any-postcode
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    image:
      url: ghcr.io/royalprince777/on-any-postcode-runtime@sha256:22fb2967afe92eba48dfbdd261160ccf4f2a93cae5d7d11c8d807d0c4a02fb69
    healthCheckPath: /healthz
    envVars:
      - key: OAP_RUNTIME_TARGET
        value: "app:app"
      - key: DATABASE_URL
        fromDatabase:
          name: oap-smi-hrm-fallback
          property: connectionString
      - key: OAP_LAB_DATABASE_AUTHORITY
        value: "platform_database_url"
      - key: OAP_LAB_IMMUTABILITY_MIGRATION_ON_BOOT
        value: "1"
      - key: OAP_LAB_RECOVERY_PROOF_ON_BOOT
        value: "1"
      - key: OAP_LIBRARY_LEARNING_MIGRATION_ON_BOOT
        value: "1"
