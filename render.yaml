services:
  - type: web
    name: oap-smi
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/RoyalPrince777/on-any-postcode
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn smi_gateway:app
    healthCheckPath: /healthz
    envVars:
      - key: OAP_PUBLIC_ORIGIN
        value: "https://on-any-postcode.onrender.com"
      - key: OAP_SURFACE_ROLE
        value: "private-gateway"
      - key: OAP_SMI_GATEWAY_SECRET
        sync: false
