services:
  - type: web
    name: oap-smi
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/RoyalPrince777/on-any-postcode
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn smi_gateway:app
    healthCheckPath: /healthz
    envVars:
      - key: OAP_PUBLIC_ORIGIN
        value: "https://on-any-postcode.onrender.com"
      - key: OAP_SURFACE_ROLE
        value: "private-gateway"
      - key: DATABASE_URL
        fromDatabase:
          name: oap-smi-hrm-fallback
          property: connectionString
      - key: OAP_SMI_GATEWAY_SECRET
        sync: false

  - type: web
    name: on-any-postcode
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/RoyalPrince777/on-any-postcode
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oap-smi-hrm-fallback
          property: connectionString

  - type: web
    name: oap-routing
    runtime: docker
    plan: starter
    region: oregon
    repo: https://github.com/RoyalPrince777/on-any-postcode
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./routing/Dockerfile
    dockerContext: .
    # OSRM has no dedicated /health endpoint; a lightweight nearest request
    # verifies that the HTTP engine and loaded graph are both answering.
    healthCheckPath: /nearest/v1/driving/-0.1276,51.5072?number=1
    envVars:
      - key: OAP_ROUTING_DATA_DIR
        value: /data
      - key: OAP_ROUTING_PBF_URL
        value: https://download.geofabrik.de/europe/united-kingdom/england/greater-london-latest.osm.pbf
    disk:
      name: oap-routing-data
      mountPath: /data
      sizeGB: 5
