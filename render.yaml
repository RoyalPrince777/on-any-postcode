services:
  - type: web
    name: on-any-postcode
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/RoyalPrince777/on-any-postcode
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    # Production secrets and governance controls remain dashboard-managed.
    # Render preserves existing environment variables omitted from a Blueprint.
