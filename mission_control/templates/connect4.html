<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="oap-csrf-token" content="{{ csrf_token }}">{% include "_oap_install_head.html" %}<title>Connect 4 · OAP Arena</title><link rel="stylesheet" href="{{ url_for('public_stylesheet') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='arena_games.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='arena_tabletop.css') }}">
<script src="{{ url_for('static', filename='connect4.js') }}" defer></script></head>
<body><main class="mc-shell arena-game arena-tabletop" data-c4-root>
<header class="tabletop-header">
  <a href="/arena">← Arena</a>
  <h1>Connect 4</h1>
  <a href="/arena/connect4/room">Online room</a>
</header>
<section data-game aria-label="Connect 4 match">
  <div class="c4-match-info">
    <div class="c4-players" data-players hidden>
      <span data-player><i role="img"></i><span></span></span>
      <span data-player><i role="img"></i><span></span></span>
    </div>
    <p data-turn role="status">Ready to play</p>
  </div>
  <div class="c4-table">
    <div class="c4-controls" data-controls role="group" aria-label="Choose column" hidden></div>
    <div class="c4-board" data-board role="img" aria-label="Empty Connect 4 board"></div>
    <div class="c4-base">
      <span class="c4-wordmark">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 0l2 7 6.5-3.5L17 10l7 2-7 2 3.5 6.5L14 17l-2 7-2-7-6.5 3.5L7 14l-7-2 7-2-3.5-6.5L10 7z"/>
        </svg>
        ON ANY POSTCODE
      </span>
    </div>
  </div>
</section>
<div class="arena-actions">
  <button data-start type="button" class="arena-primary">Play</button>
  <button data-resign type="button" hidden>Resign</button>
  <button data-stop type="button" class="arena-stop" hidden>Stop</button>
</div>
<details class="arena-disclosure" data-settings>
  <summary>Settings</summary>
  <label for="c4-player-one">Player 1</label>
  <input id="c4-player-one" data-p1 value="Player One">
  <label for="c4-player-colour">Player 1 colour</label>
  <select id="c4-player-colour" data-colour>
    <option value="red">Red</option>
    <option value="yellow">Yellow</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="purple">Purple</option>
    <option value="orange">Orange</option>
    <option value="white">White</option>
  </select>
  <label for="c4-opponent">Opponent</label>
  <select id="c4-opponent" data-mode>
    <option value="human">Person</option>
    <option value="agent">Agent</option>
  </select>
  <div data-human-wrap>
    <label for="c4-player-two">Player 2</label>
    <input id="c4-player-two" data-p2 value="Player Two">
  </div>
  <div data-agent-wrap hidden>
    <label for="c4-agent">Agent</label>
    <select id="c4-agent" data-agent>
      <option value="panther">Bagheera (Panther)</option>
      <option value="falcon">Falcon</option>
      <option value="owl">Owl</option>
      <option value="gorilla">Gorilla</option>
    </select>
    <label for="c4-level">Difficulty</label>
    <select id="c4-level" data-difficulty>
      <option value="easy">Starter</option>
      <option value="standard" selected>Club</option>
      <option value="strong">Expert</option>
    </select>
  </div>
</details>
<p data-agent-status class="arena-feedback" role="status"></p>
<button type="button" data-retry-agent hidden>Resume agent turn</button>
<p data-error class="arena-error" role="alert"></p>
</main></body></html>
