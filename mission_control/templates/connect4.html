<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="oap-csrf-token" content="{{ csrf_token }}"><title>Connect 4 · OAP Arena</title><link rel="stylesheet" href="{{ url_for('public_stylesheet') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='arena_games.css') }}"><script src="{{ url_for('static', filename='connect4.js') }}" defer></script>
<style>.c4-board{display:grid;grid-template-columns:repeat(7,48px);gap:6px;max-width:max-content}.c4-cell{width:48px;height:48px;border-radius:50%;border:1px solid var(--mc-line);display:grid;place-items:center}.c4-p1{background:#f5c451}.c4-p2{background:#a36dff}.c4-controls{display:grid;grid-template-columns:repeat(7,48px);gap:6px;max-width:max-content}.c4-controls button{padding:8px 0}</style></head>
<body><main class="mc-shell arena-game" data-c4-root>
<section class="card"><nav class="arena-nav" aria-label="Arena navigation"><a href="/arena">← All games</a></nav><p class="arena-hint">OAP Arena · First-party game</p><nav class="arena-nav" aria-label="Match modes"><a href="/arena/connect4/room">Play in a Room</a></nav><h1>🔴 Connect 4</h1><p>Drop. Connect. Win.</p><label>Player 1 <input data-p1 value="Player One"></label><label>Opponent <select data-mode><option value="human">Person</option><option value="agent">Agent</option></select></label><label data-human-wrap>Player 2 <input data-p2 value="Player Two"></label><div data-agent-wrap hidden><label>Agent <select data-agent><option value="panther">Bagheera (Panther)</option><option value="falcon">Falcon</option><option value="owl">Owl</option><option value="gorilla">Gorilla</option></select></label><label>Difficulty <select data-difficulty><option value="easy">Easy</option><option value="standard" selected>Standard</option><option value="strong">Strong</option><option value="a7">A7</option></select></label><p>Agent uses only the same visible board state as the player.</p></div><div class="arena-actions"><button data-start type="button" class="arena-primary">Start Match</button><button data-stop type="button" class="arena-stop" disabled>STOP</button></div><p data-agent-status class="arena-feedback" role="status" aria-live="polite"></p><p data-error class="arena-error" role="alert"></p></section>
<section class="card" data-game hidden><p>Turn: <strong data-turn></strong> · Status: <strong data-status></strong></p><div class="c4-controls" data-controls role="group" aria-label="Choose column"></div><div class="c4-board" data-board></div></section>
</main></body></html>
