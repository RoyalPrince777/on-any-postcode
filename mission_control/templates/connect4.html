<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="oap-csrf-token" content="{{ csrf_token }}">{% include "_oap_install_head.html" %}<title>Connect 4 · OAP Arena</title><link rel="stylesheet" href="{{ url_for('public_stylesheet') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='arena_games.css') }}"><script src="{{ url_for('static', filename='arena_gameplay_progress.js') }}" defer></script><script src="{{ url_for('static', filename='connect4.js') }}" defer></script>
<style>.c4-board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,1vw,6px);width:min(100%,372px)}.c4-cell{width:100%;aspect-ratio:1;height:auto;border-radius:50%;border:1px solid var(--mc-line);display:grid;place-items:center}.c4-p1{background:#f5c451}.c4-p2{background:#a36dff}.c4-controls{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,1vw,6px);width:min(100%,372px)}.c4-controls button{padding:8px 0;min-width:0;min-height:44px}.c4-board,.c4-controls{box-sizing:border-box}</style></head>
<body><main class="mc-shell arena-game" data-c4-root>
<section class="card">{% from "_arena_game_header.html" import game_header %}
{{ game_header("Connect 4", "/arena/connect4/room", "Online room", "Local two-player or play an agent.") }}
<details class="arena-disclosure" open>
  <summary>Settings</summary>
  <label for="c4-player-one">Player 1</label>
  <input id="c4-player-one" data-p1 value="Player One">
  <label for="c4-opponent">Opponent</label>
  <select id="c4-opponent" data-mode>
    <option value="human">Person</option>
    <option value="agent">Agent</option>
  </select>
  <div data-human-wrap>
    <label for="c4-player-two">Player 2</label>
    <input id="c4-player-two" data-p2 value="Player Two">
  </div>
  <div data-agent-wrap hidden>
    <label for="c4-agent">Agent</label>
    <select id="c4-agent" data-agent>
      <option value="panther">Bagheera (Panther)</option>
      <option value="falcon">Falcon</option>
      <option value="owl">Owl</option>
      <option value="gorilla">Gorilla</option>
    </select>
    <label for="c4-level">Difficulty</label>
    <select id="c4-level" data-difficulty>
      <option value="easy">Starter</option>
      <option value="standard" selected>Club</option>
      <option value="strong">Expert</option>
    </select>
  </div>
</details>
<div class="arena-actions"><button data-start type="button" class="arena-primary">Play</button><button data-resign type="button" disabled>Resign</button><button data-stop type="button" class="arena-stop" disabled>Stop</button></div><p data-agent-status class="arena-feedback" role="status" aria-live="polite"></p><button type="button" data-retry-agent hidden>Resume agent turn</button><p data-error class="arena-error" role="alert"></p></section>
<section class="card" data-game hidden><p>Turn: <strong data-turn></strong> · Status: <strong data-status></strong></p><p class="arena-hint" data-gameplay-percent aria-live="polite">Gameplay: 0%</p><progress data-gameplay-bar max="100" value="0" aria-label="Observable gameplay percentage"></progress><div class="c4-controls" data-controls role="group" aria-label="Choose column"></div><div class="c4-board" data-board></div></section>
</main></body></html>
