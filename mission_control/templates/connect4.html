<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="oap-csrf-token" content="{{ csrf_token }}"><title>Connect 4 · OAP Arena</title><link rel="stylesheet" href="{{ url_for('public_stylesheet') }}"><script src="{{ url_for('static', filename='connect4.js') }}" defer></script>
<style>.c4-board{display:grid;grid-template-columns:repeat(7,48px);gap:6px;max-width:max-content}.c4-cell{width:48px;height:48px;border-radius:50%;border:1px solid var(--mc-line);display:grid;place-items:center}.c4-p1{background:#f5c451}.c4-p2{background:#a36dff}.c4-controls{display:grid;grid-template-columns:repeat(7,48px);gap:6px;max-width:max-content}.c4-controls button{padding:8px 0}</style></head>
<body><main class="mc-shell" data-c4-root>
<section class="card"><p><a href="/arena">← OAP Arena</a></p><h1>🔴 Connect 4</h1><p>Drop. Connect. Win.</p><label>Player 1 <input data-p1 value="Player One"></label><label>Player 2 <input data-p2 value="Player Two"></label><button data-start>Start Match</button><button data-stop>STOP</button><p data-error></p></section>
<section class="card" data-game hidden><p>Turn: <strong data-turn></strong> · Status: <strong data-status></strong></p><div class="c4-controls" data-controls></div><div class="c4-board" data-board></div></section>
</main></body></html>
