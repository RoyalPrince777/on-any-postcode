<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAP LinkUp</title>
  <link rel="stylesheet" href="{{ url_for('public_stylesheet') }}">
</head>
<body class="mc-workspace-body">
  <header class="mc-workspace-header mc-link-header">
    <div>
      <p class="mc-eyebrow">{{ link.law }}</p>
      <h1>{{ link.product_name }}</h1>
      <p>{{ link.tagline }}</p>
    </div>
    <div class="mc-header-actions">
      <a class="mc-secondary-link" href="{{ url_for('the_spot_front_door') }}">The Spot</a>
      <a class="mc-secondary-link" href="{{ url_for('the_link_front_door') }}">The Link</a>
      <a class="mc-secondary-link" href="{{ url_for('home') }}">OAP World</a>
    </div>
  </header>
  <main class="mc-workspace mc-link-workspace">
    <section class="mc-panel" aria-labelledby="linkup-title">
      <p class="mc-eyebrow">Stay connected</p>
      <h2 id="linkup-title">Your people. Your chats. Your community.</h2>
      <div class="mc-link-view-grid" role="list" aria-label="LinkUp features">
        {% for feature in link.features %}
        <article class="mc-link-view-card" role="listitem">
          <h3>{{ feature.name }}</h3>
          <p>{{ feature.purpose }}</p>
        </article>
        {% endfor %}
      </div>
    </section>
    <aside class="mc-authority" aria-label="LinkUp privacy">
      <strong>Private by default</strong>
      <span><a href="{{ url_for('auth_page') }}">Sign in to open LinkUp.</a></span>
    </aside>
  </main>
</body>
</html>
