<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OAP Music</title><meta name="theme-color" content="#080808">
<link rel="manifest" href="/music/manifest.webmanifest">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080808;color:#fff}
*{box-sizing:border-box}body{margin:0;background:#080808}.shell{max-width:980px;margin:auto;padding:22px 18px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.brand h1{margin:4px 0;font-size:2.2rem}.muted{color:#aaa}
.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #333;background:#151515;color:#fff;border-radius:999px;padding:10px 14px;text-decoration:none}
.hero{padding:22px;border:1px solid #292929;border-radius:24px;background:#111}.search{width:100%;margin-top:16px;padding:15px;border-radius:16px;border:1px solid #333;background:#090909;color:#fff;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}.card{border:1px solid #2d2d2d;background:#121212;border-radius:18px;padding:16px}
.card audio{width:100%;margin-top:12px}.pay-row{display:flex;gap:8px;align-items:center;margin-top:12px}.pay-row input{width:92px;padding:9px;border-radius:10px;border:1px solid #333;background:#090909;color:#fff}.pay-row button{padding:9px 12px;border-radius:999px;border:1px solid #444;background:#f2f2f2;color:#111;font-weight:700}.status{margin-top:10px;color:#aaa}.lock{margin-top:12px;padding:10px;border-radius:12px;background:#17140b;color:#e3c970}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0a0af2;border-top:1px solid #262626;display:flex;justify-content:center;gap:4px;padding:8px 10px;backdrop-filter:blur(16px);z-index:20}
.bottom a{color:#aaa;text-decoration:none;padding:9px 12px;border-radius:12px;font-size:.92rem}.bottom a.active{color:#fff;background:#1b1b1b}.section-title{margin:24px 0 8px;font-size:1.05rem}.track-title{font-size:1.06rem}.track-meta{font-size:.9rem;margin-top:4px}
@media(max-width:640px){.shell{padding:16px 14px 88px}.top{align-items:flex-start;flex-direction:column}.brand h1{font-size:1.8rem}.actions{width:100%}.actions .pill{flex:1;text-align:center}.hero{padding:18px;border-radius:20px}.grid{grid-template-columns:1fr}.pay-row{align-items:stretch;flex-wrap:wrap}.pay-row input{width:82px}.pay-row .muted{width:100%}.bottom a{flex:1;text-align:center;padding:9px 4px;font-size:.82rem}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="muted">ON ANY POSTCODE</div><h1>🎵 OAP Music</h1><div class="muted">Listen. Discover. Play.</div></div>
<div class="actions"><button class="pill" type="button" data-oap-music-install hidden>＋ Install</button><a class="pill" href="/radio">📻 Radio</a><a class="pill" href="/music/studio">⬆ Studio</a></div></header>
<section class="hero"><strong>First-party OAP catalogue</strong><div class="muted">Only tracks with current rights and entitlement proof become playable.</div>
<input id="music-search" class="search" type="search" placeholder="Search tracks, releases…" autocomplete="off">
<div id="catalogue-state" class="status">Loading OAP Music…</div></section>
<section><h2 class="section-title">Listen now</h2><div id="oap-results" class="grid"></div><div id="oap-empty" class="status">No public tracks are available yet.</div><div class="status" data-oap-music-install-status role="status">First-party installable web app</div></section>
</main>
<nav class="bottom" aria-label="OAP Music"><a class="active" href="/music">🎵 Music</a><a href="/radio">📻 Radio</a><a href="/music/artist-progress">📈 Progress</a><a href="/music/studio">⬆ Studio</a></nav>
<script>
(() => {
 const input=document.getElementById('music-search'),results=document.getElementById('oap-results'),empty=document.getElementById('oap-empty'),state=document.getElementById('catalogue-state');
 let timer=null;
 function instrument(audio,track){
  let sessionId=null,sequence=1,chain=Promise.resolve(),started=false,lastBeat=0;
  function send(event){
   const seconds=Math.max(0,Math.floor(audio.currentTime||0));
   const duration=Number.isFinite(audio.duration)?Math.max(1,Math.floor(audio.duration)):null;
   chain=chain.then(async()=>{
    if(event!=='START'&&!sessionId)return;
    const body={track_id:track,surface:'OAP_MUSIC',event_type:event,playback_seconds:seconds,duration_seconds:duration};
    if(event!=='START'){body.playback_session_id=sessionId;body.event_sequence=++sequence}
    const r=await fetch('/music/api/engagement',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('engagement_unavailable');
    const result=await r.json();
    if(event==='START'){sessionId=result.playback_session_id;sequence=result.event_sequence}
   }).catch(()=>{sessionId=null});
  }
  audio.addEventListener('play',()=>{if(!started){started=true;send('START')}});
  audio.addEventListener('timeupdate',()=>{const now=Math.floor(audio.currentTime||0);if(now>=10&&now-lastBeat>=15){lastBeat=now;send('HEARTBEAT')}});
  audio.addEventListener('ended',()=>send('COMPLETE'));
 }
 async function load(){
  const q=input.value.trim(); state.textContent=q?'Searching OAP Music…':'Loading OAP Music…';
  try{
   const r=await fetch('/music/api/catalogue?q='+encodeURIComponent(q),{cache:'no-store'});
   if(!r.ok) throw new Error();
   const p=await r.json(); results.replaceChildren();
   (p.items||[]).forEach(item=>{
    const card=document.createElement('article'); card.className='card';
    const title=document.createElement('strong'); title.className='track-title'; title.textContent=item.track_title;
    const meta=document.createElement('div'); meta.className='muted track-meta'; meta.textContent=item.release_title+' · '+item.release_type;
    card.append(title,meta);
    const pay=document.createElement('div');pay.className='pay-row';
    const amount=document.createElement('input');amount.type='number';amount.min='1';amount.step='0.01';amount.value='1.00';amount.setAttribute('aria-label','Song amount in pounds');
    const button=document.createElement('button');button.type='button';button.textContent='Pay £1+';
    const payState=document.createElement('span');payState.className='muted';
    button.addEventListener('click',async()=>{const minor=Math.round(Number(amount.value||0)*100);try{const r=await fetch('/music/api/song-price?amount_minor='+encodeURIComponent(minor),{cache:'no-store'});const p=await r.json();if(!r.ok)throw new Error(p.error?.message||'Invalid amount');payState.textContent='£'+(p.amount_minor/100).toFixed(2)+' selected · payment capture not live yet';}catch(e){payState.textContent=e.message;}});
    pay.append(amount,button,payState);card.append(pay);
    if(item.playback_enabled&&item.stream_url){
      const audio=document.createElement('audio'); audio.controls=true; audio.preload='metadata'; audio.src=item.stream_url; instrument(audio,item.track_id); card.append(audio);
    } else {
      const lock=document.createElement('div'); lock.className='lock'; lock.textContent='🔒 Awaiting current rights + entitlement'; card.append(lock);
    }
    results.append(card);
   });
   empty.style.display=p.item_count?'none':'block'; state.textContent=p.item_count+' track'+(p.item_count===1?'':'s');
  }catch(e){results.replaceChildren();empty.style.display='block';state.textContent='OAP Music is temporarily unavailable.';}
 }
 input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,180)}); load();
})();
</script><script src="/assets/oap-music-install.js" defer></script></body></html>
