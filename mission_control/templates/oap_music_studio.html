<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAP Music Studio</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#080808;color:#fff}*{box-sizing:border-box}body{margin:0}.shell{max-width:980px;margin:auto;padding:22px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}.card{border:1px solid #303030;background:#121212;border-radius:18px;padding:16px}.form{display:grid;gap:10px}.form input,.form select,.form button{width:100%;padding:12px;border-radius:12px;border:1px solid #383838;background:#0b0b0b;color:#fff}.form button{background:#f2f2f2;color:#111;font-weight:700}.result{min-height:1.2em;color:#bbb;font-size:.92rem}.pill{border:1px solid #333;border-radius:999px;padding:9px 13px;color:#fff;text-decoration:none}.asset audio{width:100%;margin-top:8px}</style></head>
<body><main class="shell"><header class="top"><div><div class="muted">OAP MUSIC</div><h1>⬆ Studio</h1><div class="muted">Create → Upload → Review → Founder Approve</div></div><div><a class="pill" href="/music/artist-progress">📈 Progress</a> <a class="pill" href="/music">← Music</a></div></header>
<div class="grid">
<form id="release-form" class="card form"><strong>Create release</strong><input name="title" maxlength="180" placeholder="Release title" required><select name="release_type"><option value="single">Single</option><option value="ep">EP</option><option value="album">Album</option></select><button>Create release</button><div id="release-result" class="result"></div></form>
<form id="upload-form" class="card form" enctype="multipart/form-data"><strong>Upload song</strong><select name="release_id" id="release-select" required><option value="">Choose release</option></select><input name="title" maxlength="180" placeholder="Track title" required><input name="position" type="number" min="1" max="99" value="1" required><input name="audio" type="file" accept="audio/mpeg,audio/mp4,audio/ogg,audio/webm,audio/wav" required><button>Upload</button><div id="upload-result" class="result"></div></form>
<form id="review-form" class="card form"><strong>Rights review</strong><select id="review-release-select" required><option value="">Choose release</option></select><button>Send for review</button><div id="review-result" class="result"></div></form>
<form id="approve-form" class="card form"><strong>👑 Founder approval</strong><select id="approve-release-select" required><option value="">Choose verified release</option></select><button>Approve release</button><div id="approve-result" class="result"></div></form>
</div>
<section><h2>Your uploads</h2><div id="private-assets" class="grid"></div><div id="player-state" class="result"></div></section>
</main>
<script>
(() => {
 const csrf={{ oap_csrf_token|default('',true)|tojson }};
 const releaseSelect=document.getElementById('release-select'),reviewSelect=document.getElementById('review-release-select'),approveSelect=document.getElementById('approve-release-select'),assetsBox=document.getElementById('private-assets');
 const msg=(id,v)=>document.getElementById(id).textContent=v;
 const json=async(path,method='GET',body=null)=>{const o={method,credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}};if(method!=='GET')o.headers['X-OAP-CSRF']=csrf;if(body!==null){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}const r=await fetch(path,o);const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error?.message||p.error?.code||'Request failed');return p};
 const add=(s,v,l)=>{const o=document.createElement('option');o.value=v;o.textContent=l;s.append(o)};
 async function refresh(){try{const [music,assets]=await Promise.all([json('/mission/organs/tune'),json('/mission/organs/tune/assets')]);[releaseSelect,reviewSelect,approveSelect].forEach(s=>s.replaceChildren(new Option('Choose release','')));(music.releases||[]).forEach(r=>{const label=r.title+' · '+r.state+' · '+r.rights_status;add(releaseSelect,r.release_id,label);add(reviewSelect,r.release_id,label);if(r.state==='REVIEW_REQUIRED'&&r.rights_status==='VERIFIED')add(approveSelect,r.release_id,label)});assetsBox.replaceChildren();(assets.assets||[]).forEach(a=>{const card=document.createElement('article');card.className='card asset';const t=document.createElement('strong');t.textContent=a.original_name;const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src='/mission/organs/tune/assets/'+encodeURIComponent(a.asset_id)+'/audio';card.append(t,audio);assetsBox.append(card)});document.getElementById('player-state').textContent=(assets.assets||[]).length+' private upload(s)';}catch(e){document.getElementById('player-state').textContent='Enter My World to manage music. '+e.message}}
 document.getElementById('release-form').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget).entries());d.idempotency_key='oap-music-'+(crypto.randomUUID?.()||Date.now());try{const r=await json('/mission/organs/tune/releases','POST',d);msg('release-result','Created · '+r.title);e.currentTarget.reset();await refresh()}catch(x){msg('release-result',x.message)}});
 document.getElementById('upload-form').addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.currentTarget),id=d.get('release_id');d.delete('release_id');try{const r=await fetch('/mission/organs/tune/releases/'+encodeURIComponent(id)+'/upload',{method:'POST',credentials:'same-origin',headers:{'X-OAP-CSRF':csrf,Accept:'application/json'},body:d});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error?.message||'Upload failed');msg('upload-result','Uploaded · private player ready');e.currentTarget.reset();await refresh()}catch(x){msg('upload-result',x.message)}});
 document.getElementById('review-form').addEventListener('submit',async e=>{e.preventDefault();try{const r=await json('/mission/organs/tune/releases/'+encodeURIComponent(reviewSelect.value)+'/review','POST',{});msg('review-result','Review · '+r.state);await refresh()}catch(x){msg('review-result',x.message)}});
 document.getElementById('approve-form').addEventListener('submit',async e=>{e.preventDefault();try{const r=await json('/mission/organs/tune/releases/'+encodeURIComponent(approveSelect.value)+'/approve','POST',{});msg('approve-result','Approved · '+r.title);await refresh()}catch(x){msg('approve-result',x.message)}});
 refresh();
})();
</script></body></html>
