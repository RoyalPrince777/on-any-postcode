<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="oap-csrf-token" content="{{ csrf_token }}"><title>Dot · OAP Arena</title>
<link rel="stylesheet" href="{{ url_for('public_stylesheet') }}"><link rel="stylesheet" href="{{ url_for('static', filename='arena_games.css') }}"><script src="{{ url_for('static',filename='dot.js') }}" defer></script></head>
<body><main class="mc-shell arena-game" data-dot-root><section class="card arena-header"><nav class="arena-nav" aria-label="Arena navigation"><a href="/arena">← All games</a><a href="/arena/dot/room">Play in a Room</a></nav>
<p class="arena-hint">OAP Arena · Local pass-and-play</p><h1>⚫ Dot</h1><p>Draw. Box. Score.</p>
<p class="arena-hint">Complete a box to score and keep the turn. Otherwise play passes to the next person.</p>
<div class="arena-actions"><button type="button" class="arena-primary" data-start>Start match</button><button type="button" class="arena-stop" data-stop disabled>STOP</button></div><p class="arena-error" data-error role="alert"></p></section>
<section class="card" data-game hidden><div class="arena-metrics" aria-live="polite"><span>Turn: <strong data-turn></strong></span><span>Status: <strong data-status></strong></span></div>
<h2>Choose an available edge</h2><div class="arena-game-content" data-edges role="group" aria-label="Available Dot edges"></div>
<p class="arena-feedback" data-score role="status" aria-live="polite"></p>
<details><summary>Enter an edge by coordinates</summary><div class="arena-row"><label class="arena-field">Start point<input data-a maxlength="3" placeholder="0,0" autocomplete="off"></label>
<label class="arena-field">End point<input data-b maxlength="3" placeholder="1,0" autocomplete="off"></label>
<button data-draw type="button">Draw edge</button></div></details>
<p data-state class="arena-hint" aria-live="polite"></p></section></main></body></html>
