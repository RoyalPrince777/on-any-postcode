<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAP Radio</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#070707;color:#fff}*{box-sizing:border-box}body{margin:0}.shell{max-width:880px;margin:auto;padding:24px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#aaa}.card{border:1px solid #303030;background:#111;border-radius:20px;padding:18px;margin-top:16px}.form{display:grid;gap:10px}.form input,.form select,.form button{padding:12px;border-radius:12px;border:1px solid #383838;background:#0a0a0a;color:#fff}.form button{background:#f2f2f2;color:#111;font-weight:700}.player audio{width:100%;margin-top:12px}.pill{border:1px solid #333;border-radius:999px;padding:9px 13px;color:#fff;text-decoration:none}.status{color:#bbb;margin-top:8px}</style></head>
<body><main class="shell"><header class="top"><div><div class="muted">ON ANY POSTCODE</div><h1>📻 OAP Radio</h1><div class="muted">Always On · first-party rotation</div></div><a class="pill" href="/music">🎵 Music</a></header>
<section class="card player"><strong>Now playing</strong><div id="now-title" class="status">Finding cleared OAP Music…</div><audio id="radio-player" controls autoplay preload="metadata"></audio><div class="status">The player advances through currently cleared public OAP tracks. STOP/rights changes remain authoritative.</div></section>
<section class="card"><strong>My Radio Action</strong><form id="always-form" class="form"><select id="station-select" required><option value="">Choose station</option></select><button type="submit">▶ Keep Radio Always On</button><button type="button" id="stop-button">🛑 STOP</button><div id="control-result" class="status"></div></form></section>
<section class="card"><strong>Create station</strong><form id="station-form" class="form"><input name="name" maxlength="180" placeholder="Station name" required><input name="slug" pattern="[a-z0-9][a-z0-9-]{1,61}[a-z0-9]" placeholder="station-slug" required><button>Create station</button><div id="station-result" class="status"></div></form></section>
</main>
<script>
(() => {
 const csrf={{ oap_csrf_token|default('',true)|tojson }},player=document.getElementById('radio-player'),title=document.getElementById('now-title'),stationSelect=document.getElementById('station-select');let queue=[],index=0;
 async function publicQueue(){try{const r=await fetch('/music/api/catalogue',{cache:'no-store'}),p=await r.json();queue=(p.items||[]).filter(x=>x.playback_enabled&&x.stream_url);if(!queue.length){title.textContent='No cleared tracks available yet.';player.removeAttribute('src');return}play(0)}catch(e){title.textContent='Radio catalogue unavailable.'}}
 function play(i){if(!queue.length)return;index=i%queue.length;const x=queue[index];title.textContent=x.track_title+' · '+x.release_title;player.src=x.stream_url;player.play().catch(()=>{})}
 player.addEventListener('ended',()=>play(index+1));
 const api=async(path,method='GET',body=null)=>{const o={method,credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}};if(method!=='GET')o.headers['X-OAP-CSRF']=csrf;if(body!==null){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}const r=await fetch(path,o),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error?.message||p.error?.code||'Request failed');return p};
 async function refresh(){try{const r=await api('/mission/organs/radio');stationSelect.replaceChildren(new Option('Choose station',''));(r.stations||[]).forEach(s=>{const o=document.createElement('option');o.value=s.station_id;o.textContent=s.name+(s.always_on?' · ALWAYS ON':'')+(s.stopped?' · STOPPED':'');stationSelect.append(o)})}catch(e){document.getElementById('control-result').textContent='Enter My World to control your station.'}}
 document.getElementById('always-form').addEventListener('submit',async e=>{e.preventDefault();try{const r=await api('/mission/organs/radio/stations/'+encodeURIComponent(stationSelect.value)+'/always-on','POST',{enabled:true,auto_add_approved:true});document.getElementById('control-result').textContent=r.always_on?'Always On active · approved music can feed rotation':'Manual mode';await refresh()}catch(x){document.getElementById('control-result').textContent=x.message}});
 document.getElementById('stop-button').addEventListener('click',async()=>{try{const r=await api('/mission/organs/radio/stations/'+encodeURIComponent(stationSelect.value)+'/stop','POST',{reason:'Founder STOP'});document.getElementById('control-result').textContent=r.stopped?'STOP active':'STOP unchanged';player.pause();await refresh()}catch(x){document.getElementById('control-result').textContent=x.message}});
 document.getElementById('station-form').addEventListener('submit',async e=>{e.preventDefault();try{const r=await api('/mission/organs/radio/stations','POST',Object.fromEntries(new FormData(e.currentTarget).entries()));document.getElementById('station-result').textContent='Created · '+r.name;e.currentTarget.reset();await refresh()}catch(x){document.getElementById('station-result').textContent=x.message}});
 publicQueue();refresh();
})();
</script></body></html>
