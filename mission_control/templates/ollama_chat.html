t:1.3!important;overflow-y:auto!important}.composer-bar{margin-top:1px!important;min-height:30px!important}.composer-left,.composer-right{gap:4px!important}.icon-btn{width:30px!important;height:30px!important;font-size:.84rem!important}.send{width:31px!important;height:31px!important}.tool-btn{padding:3px 6px!important;font-size:.61rem!important}.status-row{max-width:780px!important;margin:2px auto 0!important;min-height:12px!important}.status{font-size:.56rem!important;line-height:1.1!important}.name-input{height:24px!important;padding:3px 7px!important;font-size:.61rem!important}.mobile-chats-toggle{display:none;border:1px solid var(--line);background:#10231a;color:var(--text);border-radius:999px;padding:4px 7px;font-size:.62rem;cursor:pointer}.history-backdrop{display:none;position:fixed;inset:34px 0 0;background:#0008;z-index:19}@media(max-width:980px){.workspace-grid{grid-template-columns:190px minmax(0,1fr)!important}.msg{max-width:84%!important}}@media(max-width:820px){.navs{display:none!important}.workspace-grid{height:100dvh!important;grid-template-columns:1fr!important;grid-template-rows:minmax(0,1fr)!important}.chatbox{height:100dvh!important}.chat-head{min-height:40px!important;padding:4px 6px!important}.mobile-chats-toggle{display:inline-flex!important;align-items:center!important}.chat-head-actions{gap:4px}.corner-action{padding:5px 7px!important;font-size:.6rem!important}.smi-settings{top:39px;right:5px}.history{display:block!important;position:fixed!important;top:0!important;left:0!important;bottom:0!important;width:min(82vw,290px)!important;z-index:30!important;transform:translateX(-105%);transition:transform .18s ease!important;box-shadow:10px 0 30px #0009!important;border-right:1px solid var(--line)!important}.history.mobile-open{transform:translateX(0)!important}.history-backdrop.mobile-open{display:block!important;inset:0!important;z-index:29!important}.smi-function-rail{padding:5px 6px}.smi-chip{min-height:32px;font-size:.68rem;padding:5px 8px}.messages{padding:6px 7px 5px!important}.msg{max-width:91%!important;padding:7px 9px!important;margin:3px 0!important}.composer{padding:3px 5px calc(3px + env(safe-area-inset-bottom))!important}.composer textarea{min-height:28px!important;height:28px;max-height:76px!important;font-size:.85rem!important}.status-row{display:flex!important;margin-top:1px!important}.status{font-size:.52rem!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.name-input{display:none!important}.thinking{margin:0 5px 3px!important;max-height:92px!important}.chat-subtitle{font-size:.56rem!important}}@media(max-width:520px){.chat-head .chat-subtitle:not(#provider-state){display:none}.corner-action span{display:none}.corner-action{width:30px;height:30px;padding:0!important;display:grid;place-items:center}}
/* Quiet 2027 workbench: one conversation, one compact rail, one tool drawer. */
html,body{background:#070a08!important}.navs{display:none!important}.workspace-grid{height:100dvh!important;grid-template-columns:216px minmax(0,1fr)!important}.history{background:#090d0a!important}.chatbox,.chat-head,.composer{background:#0a0e0b!important}.smi-function-rail{background:#090d0a!important;padding:7px 10px!important;gap:7px!important}.smi-chip{border-color:#20372a!important;border-radius:10px!important;background:#0d1711!important;min-height:32px!important;padding:6px 10px!important;font-weight:700!important}.smi-chip.lock{border-color:#38453d!important}.smi-tool-drawer{display:none;position:absolute;z-index:80;right:10px;top:48px;width:min(390px,calc(100vw - 20px));max-height:calc(100dvh - 64px);overflow:auto;padding:12px;border:1px solid #294334;border-radius:16px;background:#0a110d;box-shadow:0 20px 60px #000c}.smi-tool-drawer.show{display:block}.smi-tool-drawer h2{font-size:1rem;margin:0 0 4px}.smi-tool-drawer>p{color:var(--muted);font-size:.72rem;margin:0 0 10px}.smi-tool-grid{display:grid;gap:8px}.smi-tool-card{border:1px solid #24392d;border-radius:12px;background:#0c1710;padding:10px}.smi-tool-card header{display:flex;align-items:center;justify-content:space-between;gap:8px}.smi-tool-card strong{font-size:.82rem}.smi-tool-card p{color:var(--muted);font-size:.68rem;line-height:1.35;margin:5px 0 0}.smi-state{font-size:.62rem;font-weight:800;border-radius:999px;padding:4px 7px;background:#14221a}.smi-state.green{color:#66e799}.smi-state.yellow{color:#f3ce70}.smi-governance{margin-top:10px;border-top:1px solid #24392d;padding-top:9px;color:var(--muted);font-size:.66rem;line-height:1.45}@media(max-width:820px){.workspace-grid{grid-template-columns:1fr!important}}
</style>
<script>
/* Personal SMI chat: no repeated SMI prefix, direct function buttons, safe visible stages only. */
const personalTitle=document.querySelector('.chat-title');
const personalSubtitle=document.querySelector('.chat-head .chat-subtitle');
if(personalTitle)personalTitle.textContent='Personal SMI';
if(personalSubtitle)personalSubtitle.textContent='Private Founder intelligence · straight answers · guarded actions';
document.title='Personal SMI · OAP';
const publicOapOrigin='https://on-any-postcode.onrender.com/';
const publicFrontDoor=Array.from(document.querySelectorAll('.navs a')).find(link=>link.textContent.trim()==='OAP Front Door');
if(publicFrontDoor){publicFrontDoor.href=publicOapOrigin;publicFrontDoor.rel='noopener'}
const navs=document.querySelector('.navs');
if(navs){
  const links=[['SMI Home','{{ url_for('mission_control.mission_workspace') }}'],['Intelligence','{{ url_for('mission_control.brain_dashboard') }}'],['War Room','{{ url_for('mission_control.war_room_dashboard') }}'],['Signals','/mission/smi/thinking-signals'],['Receipts','/mission/smi/brain/receipts'],['Judgement','{{ url_for('mission_control.judgement_dashboard') }}']];
  navs.innerHTML=links.map(([label,href])=>`<a href="${href}">${label}</a>`).join('');
}
const composerInput=document.getElementById('message');
if(composerInput){
  composerInput.rows=1;composerInput.placeholder='Ask directly…';
  const resizeComposer=()=>{composerInput.style.height='30px';composerInput.style.height=Math.min(composerInput.scrollHeight,88)+'px'};
  composerInput.addEventListener('input',resizeComposer);
  composerInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.getElementById('chat-form')?.requestSubmit()}});
  resizeComposer();
}
const thinkingTitle=document.getElementById('thinking-title');
if(thinkingTitle)thinkingTitle.textContent='🧠 Thinking Process · safe work stages';
const thinkingPanel=document.getElementById('thinking');
if(thinkingPanel){thinkingPanel.setAttribute('aria-label','Safe SMI Thinking Process stages only');thinkingPanel.setAttribute('title','Shows governed operational state only; private chain-of-thought is never exposed.');}
const providerStateLabel=document.getElementById('provider-state');
if(providerStateLabel)providerStateLabel.setAttribute('title','Governed operational state only.');

const quickActions=[
  ['🧠 Intelligence','Give me a concise intelligence brief on '],
  ['⚔ War Room','Run War Room check now. Show proof, risk, strongest link, weakest link, and next gate.'],
  ['✓ Readiness','Run readiness and gaps on ']
];
const chatbox=document.querySelector('.chatbox');
const messagesBox=document.getElementById('messages');
if(chatbox&&messagesBox&&!document.querySelector('.smi-function-rail')){
  const rail=document.createElement('section');rail.className='smi-function-rail';rail.setAttribute('aria-label','SMI function shortcuts');
  quickActions.forEach(([label,prompt])=>{const button=document.createElement('button');button.type='button';button.className='smi-chip';button.textContent=label;button.addEventListener('click',()=>{const input=document.getElementById('message');if(!input)return;input.value=prompt;input.focus();input.setSelectionRange(input.value.length,input.value.length);input.dispatchEvent(new Event('input',{bubbles:true}));});rail.append(button)});
  const links=[['Systems','{{ url_for('mission_control.brain_dashboard') }}'],['Receipts','/mission/smi/brain/receipts']];
  links.forEach(([label,href])=>{const a=document.createElement('a');a.className='smi-chip lock';a.href=href;a.textContent=label;rail.append(a)});
  chatbox.insertBefore(rail,messagesBox);
}

const historyPanel=document.querySelector('.history');
const chatHead=document.querySelector('.chat-head');
if(historyPanel&&chatHead&&!document.querySelector('.mobile-chats-toggle')){
  const toggle=document.createElement('button');toggle.type='button';toggle.className='mobile-chats-toggle';toggle.textContent='☰ Chats';toggle.setAttribute('aria-label','Open conversation history');
  const backdrop=document.createElement('div');backdrop.className='history-backdrop';document.body.append(backdrop);
  const closeHistory=()=>{historyPanel.classList.remove('mobile-open');backdrop.classList.remove('mobile-open');toggle.setAttribute('aria-expanded','false')};
  toggle.addEventListener('click',()=>{const opening=!historyPanel.classList.contains('mobile-open');historyPanel.classList.toggle('mobile-open',opening);backdrop.classList.toggle('mobile-open',opening);toggle.setAttribute('aria-expanded',String(opening))});
  backdrop.addEventListener('click',closeHistory);document.addEventListener('keydown',event=>{if(event.key==='Escape')closeHistory()});
  chatHead.insertBefore(toggle,chatHead.firstChild);
  const actions=document.createElement('div');actions.className='chat-head-actions';
  const newChat=document.createElement('button');newChat.type='button';newChat.className='corner-action';newChat.setAttribute('aria-label','Start new chat');newChat.innerHTML='＋ <span>New</span>';newChat.addEventListener('click',()=>document.getElementById('new-chat')?.click());
  const war=document.createElement('a');war.className='corner-action';war.href='{{ url_for('mission_control.war_room_dashboard') }}';war.innerHTML='⚔️ <span>War</span>';war.style.textDecoration='none';
  const toolsButton=document.createElement('button');toolsButton.type='button';toolsButton.className='corner-action';toolsButton.setAttribute('aria-label','Open connected tools');toolsButton.setAttribute('aria-expanded','false');toolsButton.innerHTML='◫ <span>Tools</span>';
  const settingsButton=document.createElement('button');settingsButton.type='button';settingsButton.className='corner-action';settingsButton.setAttribute('aria-label','Open chat settings');settingsButton.setAttribute('aria-expanded','false');settingsButton.innerHTML='⚙ <span>Settings</span>';
  const settings=document.createElement('div');settings.className='smi-settings';settings.setAttribute('role','dialog');settings.setAttribute('aria-label','Personal SMI chat settings');
  settings.innerHTML=`<label class="smi-setting-row"><span>Show work stages<small>Visible process only, never private reasoning.</small></span><input id="setting-work-stages" type="checkbox"></label><label class="smi-setting-row"><span>Voice replies<small>Read answers aloud when supported.</small></span><input id="setting-voice" type="checkbox"></label><label class="smi-setting-row"><span>Code mode<small>Bias chat toward coding tasks.</small></span><input id="setting-code" type="checkbox"></label>`;
  const tools=document.createElement('aside');tools.className='smi-tool-drawer';tools.setAttribute('role','dialog');tools.setAttribute('aria-label','SMI systems and tools');tools.innerHTML='<h2>Systems</h2><p>Live capability state. Credentials are never shown.</p><div class="smi-tool-grid" id="smi-tool-grid"><div class="smi-tool-card">Loading secure status…</div></div><div class="smi-governance">SMI can inspect, advise and prepare proposals. Deploys, writes, payments and security changes require a separate explicit Human Authority approval.</div>';
  actions.append(newChat,war,toolsButton,settingsButton);chatHead.append(actions,tools,settings);
  const workbenchUrl={{ url_for('mission_control.smi_workbench_status')|tojson }};
  const loadWorkbench=async()=>{const grid=tools.querySelector('#smi-tool-grid');try{const response=await fetch(workbenchUrl,{cache:'no-store',credentials:'same-origin'}),data=await response.json();if(!response.ok)throw new Error('Systems unavailable');grid.textContent='';[...data.connectors,...data.capabilities].forEach(item=>{const ready=item.ready===undefined?item.configured:item.ready;const card=document.createElement('section');card.className='smi-tool-card';const head=document.createElement('header'),name=document.createElement('strong'),state=document.createElement('span');name.textContent=item.name;state.className='smi-state '+(ready?'green':'yellow');state.textContent=ready?'Ready':item.configured?'Attention':'Setup needed';head.append(name,state);const copy=document.createElement('p');copy.textContent=item.purpose||item.mode||'Available in this Founder workspace.';card.append(head,copy);grid.append(card)})}catch(error){grid.textContent=error.message}};
  toolsButton.addEventListener('click',()=>{const open=!tools.classList.contains('show');tools.classList.toggle('show',open);toolsButton.setAttribute('aria-expanded',String(open));if(open)loadWorkbench()});
  const stageToggle=settings.querySelector('#setting-work-stages'),voiceToggle=settings.querySelector('#setting-voice'),codeToggle=settings.querySelector('#setting-code');
  const speaker=document.getElementById('speaker-button'),code=document.getElementById('code-button');
  const storedStages=localStorage.getItem('oap.smi.showWorkStages');stageToggle.checked=storedStages===null?true:storedStages==='1';
  if(!stageToggle.checked)thinkingPanel?.classList.add('user-hidden');
  voiceToggle.checked=speaker?.getAttribute('aria-pressed')==='true';codeToggle.checked=code?.getAttribute('aria-pressed')==='true';
  stageToggle.addEventListener('change',()=>{localStorage.setItem('oap.smi.showWorkStages',stageToggle.checked?'1':'0');thinkingPanel?.classList.toggle('user-hidden',!stageToggle.checked)});
  voiceToggle.addEventListener('change',()=>{if((speaker?.getAttribute('aria-pressed')==='true')!==voiceToggle.checked)speaker?.click()});
  codeToggle.addEventListener('change',()=>{if((code?.getAttribute('aria-pressed')==='true')!==codeToggle.checked)code?.click()});
  settingsButton.addEventListener('click',()=>{const open=!settings.classList.contains('show');settings.classList.toggle('show',open);settingsButton.setAttribute('aria-expanded',String(open))});
  document.addEventListener('click',event=>{if(!settings.contains(event.target)&&!settingsButton.contains(event.target)){settings.classList.remove('show');settingsButton.setAttribute('aria-expanded','false')}});
}
</script>
