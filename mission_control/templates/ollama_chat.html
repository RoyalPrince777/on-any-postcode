<script>

if(composerInput){composerInput.rows=1;composerInput.placeholder='Ask SMI…';const resize=()=>{composerInput.style.height='31px';composerInput.style.height=Math.min(composerInput.scrollHeight,96)+'px'};composerInput.addEventListener('input',resize);composerInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('chat-form')?.requestSubmit()}});resize()}
function inline(parent,text){const re=/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g;let last=0;for(const m of text.matchAll(re)){if(m.index>last)parent.append(document.createTextNode(text.slice(last,m.index)));const t=m[0];if(t.startsWith('**')){const e=document.createElement('strong');e.textContent=t.slice(2,-2);parent.append(e)}else if(t.startsWith('`')){const e=document.createElement('code');e.className='md-inline-code';e.textContent=t.slice(1,-1);parent.append(e)}else{const p=t.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/);if(p){const a=document.createElement('a');a.className='md-link';a.textContent=p[1];a.href=p[2];a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}}last=m.index+t.length}if(last<text.length)parent.append(document.createTextNode(text.slice(last)))}
function rich(body,text){body.textContent='';const blocks=String(text||'').split(/```/);blocks.forEach((block,index)=>{if(index%2){const first=block.indexOf('\n'),lang=first>=0?block.slice(0,first).trim():'code',code=first>=0?block.slice(first+1):block,wrap=document.createElement('div');wrap.className='code-block';const head=document.createElement('div');head.className='code-head';const label=document.createElement('span');label.textContent=lang||'code';const copy=document.createElement('button');copy.type='button';copy.className='copy';copy.textContent='Copy code';copy.onclick=async()=>{try{await navigator.clipboard.writeText(code);copy.textContent='Copied ✓'}catch{copy.textContent='Copy failed'}setTimeout(()=>copy.textContent='Copy code',1400)};head.append(label,copy);const pre=document.createElement('pre'),c=document.createElement('code');c.textContent=code;pre.append(c);wrap.append(head,pre);body.append(wrap);return}const lines=block.split('\n');let i=0;while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){const e=document.createElement('div');e.className='md-h h'+h[1].length;inline(e,h[2]);body.append(e);i++;continue}if(/^>\s?/.test(line)){const e=document.createElement('div');e.className='md-quote';inline(e,line.replace(/^>\s?/,''));body.append(e);i++;continue}if(/^[-*]\s+/.test(line)){const ul=document.createElement('ul');ul.className='md-list';while(i<lines.length&&/^[-*]\s+/.test(lines[i])){const li=document.createElement('li');inline(li,lines[i].replace(/^[-*]\s+/,''));ul.append(li);i++}body.append(ul);continue}if(/^\d+\.\s+/.test(line)){const ol=document.createElement('ol');ol.className='md-list';while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){const li=document.createElement('li');inline(li,lines[i].replace(/^\d+\.\s+/,''));ol.append(li);i++}body.append(ol);continue}const p=document.createElement('div');p.className='md-p';inline(p,line);body.append(p);i++}})}
try{renderMessage=rich}catch{}
function enhance(msg){if(msg.dataset.enhanced)return;msg.dataset.enhanced='1';const body=msg.querySelector('.msg-text');if(body&&body.innerText)rich(body,body.innerText);let actions=msg.querySelector('.msg-actions');if(!actions){actions=document.createElement('div');actions.className='msg-actions';msg.append(actions)}if(msg.classList.contains('user')){const b=document.createElement('button');b.className='msg-action-extra';b.type='button';b.textContent='Edit';b.onclick=()=>{composerInput.value=body?.innerText||'';composerInput.focus();composerInput.dispatchEvent(new Event('input',{bubbles:true}))};actions.append(b)}if(msg.classList.contains('assistant')){const b=document.createElement('button');b.className='msg-action-extra';b.type='button';b.textContent='Retry';b.onclick=()=>{let p=msg.previousElementSibling;while(p&&!p.classList.contains('user'))p=p.previousElementSibling;if(!p)return;composerInput.value=p.querySelector('.msg-text')?.innerText||'';composerInput.dispatchEvent(new Event('input',{bubbles:true}));document.getElementById('chat-form')?.requestSubmit()};actions.append(b)}}
document.querySelectorAll('.msg').forEach(enhance);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.classList?.contains('msg'))enhance(n);n.querySelectorAll?.('.msg').forEach(enhance)}}))).observe(messagesBox,{childList:true,subtree:true});
if(historyPanel&&!historyPanel.querySelector('.history-search')){const s=document.createElement('input');s.className='history-search';s.type='search';s.placeholder='Search conversations';historyPanel.querySelector('.history-head')?.insertAdjacentElement('afterend',s);s.oninput=()=>historyListEl?.querySelectorAll('.history-item').forEach(i=>i.style.display=!s.value||i.innerText.toLowerCase().includes(s.value.toLowerCase())?'':'none')}

const workbenchUrl={{ url_for('mission_control.smi_workbench_status')|tojson }},proposalBase='{{ url_for('founder_tools.github_propose_branch') }}'.replace('/branch',''),approvalUrl='{{ url_for('founder_tools.github_action_approval') }}',executeUrl='{{ url_for('founder_tools.github_execute_approved_action') }}';let cache=null;
const addTool=(title,text,state='green')=>{const c=document.createElement('div');c.className='msg tool-result';const h=document.createElement('strong');h.textContent=`${state==='green'?'🟢':'🟡'} ${title}`;const b=document.createElement('span');b.className='tool-meta';b.textContent=text;c.append(h,b);messagesBox.append(c);messagesBox.scrollTop=messagesBox.scrollHeight};const wb=async(force=false)=>{if(cache&&!force)return cache;const r=await fetch(workbenchUrl,{cache:'no-store',credentials:'same-origin'}),d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Tools unavailable');cache=d;return d};
async function inspect(id,button){button.disabled=true;try{const data=await wb(true),item=data.connectors.find(x=>x.id===id);if(!item)throw new Error('Connector not registered');if(!item.configured){addTool(item.name,'Setup needed. Credentials are never shown.','yellow');return}const r=await fetch(item.inspect_url,{cache:'no-store',credentials:'same-origin'}),p=await r.json();if(!r.ok)throw new Error(p?.error?.message||'Inspection unavailable');addTool(item.name,JSON.stringify(p.data||p.database||p,null,2).slice(0,1800),item.ready?'green':'yellow')}catch(e){addTool(id,e.message||'Inspection unavailable','yellow')}finally{button.disabled=false;attachMenu?.classList.remove('show')}}
function fields(card,kind){const a=card.querySelector('[data-fields]');a.textContent='';const add=(label,name,ta=false,ph='')=>{const l=document.createElement('label');l.textContent=label;const x=document.createElement(ta?'textarea':'input');x.name=name;x.placeholder=ph;l.append(x);a.append(l)};if(kind==='branch'){add('Branch','branch',false,'oap-mind/feature');add('Base SHA','base_sha',false,'40-character SHA')}else if(kind==='file'){add('Branch','branch',false,'oap-mind/feature');add('Path','path');add('Commit message','message');add('Existing SHA (optional)','sha');add('Complete file content','content',true)}else{add('Head branch','head',false,'oap-mind/feature');add('Title','title');add('Body','body',true);add('Base','base',false,'main');a.querySelector('[name=base]').value='main'}}
function githubAction(){attachMenu?.classList.remove('show');const c=document.createElement('div');c.className='msg action-card';c.innerHTML='<strong>⚫ Governed GitHub Action</strong><span class="tool-meta">Prepare → exact review → Human Authority receipt → Living Kernel. Nothing runs before approval.</span><label>Action<select data-kind><option value="branch">Create branch</option><option value="file">Write file</option><option value="pr">Create pull request</option></select></label><div data-fields></div><div class="action-row"><button class="action-btn primary" data-prepare type="button">Prepare exact plan</button></div><span class="tool-meta" data-state>Not prepared.</span>';messagesBox.append(c);const k=c.querySelector('[data-kind]');fields(c,k.value);k.onchange=()=>fields(c,k.value);c.querySelector('[data-prepare]').onclick=async e=>{const state=c.querySelector('[data-state]'),button=e.currentTarget;button.disabled=true;try{const payload=Object.fromEntries([...c.querySelectorAll('[data-fields] input,[data-fields] textarea')].map(x=>[x.name,x.value]));const endpoint=proposalBase+'/'+(k.value==='pr'?'pull-request':k.value);const r=await fetch(endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-OAP-CSRF':csrfToken},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Proposal failed');const p=d.proposal;state.textContent=`${p.action_type}\nDigest ${p.action_digest}\nRequest ${p.request_id}`;button.remove();const row=document.createElement('div');row.className='action-row';const yes=document.createElement('button');yes.className='action-btn primary';yes.textContent='Approve';const no=document.createElement('button');no.className='action-btn danger';no.textContent='Reject';row.append(yes,no);c.append(row);const decide=async decision=>{yes.disabled=no.disabled=true;const ar=await fetch(approvalUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-OAP-CSRF':csrfToken},body:JSON.stringify({request_id:p.request_id,decision,action_type:p.action_type,action_digest:p.action_digest})}),ad=await ar.json();if(!ar.ok){state.textContent=ad?.error?.message||'Decision failed';yes.disabled=no.disabled=false;return}const receipt=ad.approval;state.textContent=`${receipt.decision} · signed ${receipt.receipt_id}\nExpires ${receipt.expires_at}`;if(receipt.decision==='APPROVED'){const run=document.createElement('button');run.className='action-btn primary';run.textContent='Execute through Living Kernel';row.append(run);run.onclick=async()=>{run.disabled=true;const er=await fetch(executeUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-OAP-CSRF':csrfToken},body:JSON.stringify({receipt_id:receipt.receipt_id,plan:p})}),ed=await er.json();if(!er.ok){state.textContent=ed?.error?.message||'Execution blocked';run.disabled=false;return}state.textContent=`${ed.executed?'EXECUTED':'BLOCKED'} · ${ed.state}\n${ed.reason}\nAudit ${ed.audit_event_id||'recorded'}`;run.textContent=ed.executed?'Executed ✓':'Blocked'}}};yes.onclick=()=>decide('APPROVED');no.onclick=()=>decide('REJECTED')}catch(err){state.textContent=err.message||'Proposal failed';button.disabled=false}};messagesBox.scrollTop=messagesBox.scrollHeight}
if(plusButton&&attachMenu&&!attachMenu.querySelector('[data-oap-connectors]')){const d=document.createElement('div');d.className='attach-divider';d.dataset.oapConnectors='1';attachMenu.append(d);const l=document.createElement('div');l.className='attach-section-label';l.textContent='Connected tools';attachMenu.append(l);[['render','🟣','Render'],['github','⚫','GitHub'],['neon','🟢','Neon']].forEach(([id,icon,name])=>{const b=document.createElement('button');b.type='button';b.className='attach-option connector';b.innerHTML=`<span class="connector-copy"><span>${icon}</span><span>${name}</span></span><span class="connector-state">Inspect</span>`;b.onclick=()=>inspect(id,b);attachMenu.append(b)});const a=document.createElement('button');a.type='button';a.className='attach-option connector';a.innerHTML='<span class="connector-copy"><span>⚙️</span><span>Governed GitHub action</span></span><span class="connector-state attention">Approval</span>';a.onclick=githubAction;attachMenu.append(a);const note=document.createElement('div');note.className='attach-note';note.textContent='Credentials never appear here. Consequential actions require Human Authority and a signed receipt.';attachMenu.append(note)}
const nativeFetch=window.fetch.bind(window);window.fetch=async function(input,init){const response=await nativeFetch(input,init);try{const url=typeof input==='string'?input:input?.url||'';if(url===streamUrl){response.clone().text().then(text=>{for(const block of text.split(/\n\n+/)){if(!block.includes('event: complete'))continue;const line=block.split('\n').find(x=>x.startsWith('data: '));if(line){try{window.dispatchEvent(new CustomEvent('oap-smi-complete',{detail:JSON.parse(line.slice(6)).result}))}catch{}}}})}}catch{}return response};
window.addEventListener('oap-smi-complete',e=>{const r=e.detail||{},c=document.createElement('div');c.className='msg receipt-card';c.innerHTML='<strong>🧾 JOOG / HRM receipt</strong><span class="receipt-meta">Shown only after the governed response completed and returned its recorded result.</span>';const g=document.createElement('div');g.className='receipt-grid';[['Request',r.request_id],['Guardian',r.guardian],['Provider',`${r.provider||'—'} · ${r.model||'—'}`],['Output',r.output_state],['Memory',r.adaptive?.active?`${r.adaptive.hrm_lessons||0} HRM lessons used`:'—'],['Judgement',r.judgement?`${r.judgement.completed_sections}/${r.judgement.total_sections}`:'—'],['Authority',r.human_authority_final?'Human final':'attention'],['Execute',r.can_execute===false?'Locked':'attention']].forEach(([k,v])=>{const p=document.createElement('div');p.className='receipt-pill';const b=document.createElement('b');b.textContent=k;const s=document.createElement('span');s.textContent=String(v||'—');p.append(b,s);g.append(p)});c.append(g);messagesBox.append(c);messagesBox.scrollTop=messagesBox.scrollHeight});
const form=document.getElementById('chat-form');if(form){['dragenter','dragover'].forEach(n=>form.addEventListener(n,e=>{e.preventDefault();form.classList.add('drop-active')}));['dragleave','drop'].forEach(n=>form.addEventListener(n,e=>{e.preventDefault();form.classList.remove('drop-active')}));form.addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(!f)return;const target=f.type.startsWith('image/')?document.getElementById('image-input'):document.getElementById('media-input');if(!target)return;const dt=new DataTransfer();dt.items.add(f);target.files=dt.files;target.dispatchEvent(new Event('change',{bubbles:true}))})}
