{# Thinking Process: Understand · Context · Route · Evidence · Challenge · Synthesise · Govern. Safe stage telemetry only; private chain-of-thought stays private. #}
{% include "ollama_chat_base.html" %}
<style>
/* Quiet 2027 workbench · Open connected tools through the composer + button. */
html,body{width:100%!important;height:100%!important;min-height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#070a08!important}
body.mc-workspace-body{margin:0!important;padding:0!important;max-width:none!important;overflow:hidden!important}
.smi-shell{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:0!important;overflow:hidden!important}
.navs{display:none!important}.workspace-grid{height:100dvh!important;grid-template-columns:216px minmax(0,1fr)!important;gap:0!important;margin:0!important;overflow:hidden!important}.history{background:#090d0a!important;padding:9px!important;min-height:0!important;height:100%!important;overflow-y:auto!important}.chatbox{height:100%!important;min-height:0!important;overflow:hidden!important;background:#0a0e0b!important}.chat-head{position:relative!important;min-height:42px!important;padding:6px 9px!important;background:#0a0e0b!important}.chat-title{font-size:.9rem!important}.chat-subtitle{font-size:.62rem!important}.chat-head-actions{margin-left:auto;display:flex;align-items:center;gap:5px}.corner-action{border:1px solid var(--line);background:#10231a;color:var(--text);border-radius:999px;padding:6px 8px;font-size:.64rem;line-height:1;text-decoration:none;cursor:pointer}.corner-action:hover,.corner-action:focus{border-color:var(--green)}
.messages{flex:1 1 auto!important;min-height:0!important;max-height:none!important;overflow-y:auto!important;padding:9px clamp(8px,2vw,20px) 6px!important;font-size:.88rem!important}.msg{max-width:min(82%,760px)!important;padding:8px 10px!important;margin:4px 0!important;line-height:1.38!important;border-radius:12px!important}.msg.tool-result{max-width:min(92%,820px)!important;background:#08140d!important;border:1px solid #294535!important}.tool-result strong{display:block;margin-bottom:3px;color:#e8fff0}.tool-meta{display:block;color:var(--muted);font-size:.7rem;white-space:pre-wrap}
.thinking{flex:0 0 auto!important;margin:0 8px 4px!important;border-radius:9px!important;max-height:104px!important;overflow:auto!important}.thinking-head{padding:4px 7px!important;font-size:.67rem!important}.thinking-log{padding:0 7px 4px!important;font-size:.63rem!important}.thinking.user-hidden{display:none!important}
.composer{flex:0 0 auto!important;padding:4px 7px calc(4px + env(safe-area-inset-bottom))!important;background:#0a0e0b!important}.composer-box{max-width:820px!important;padding:4px 5px!important;border-radius:14px!important;margin:0 auto!important}.composer textarea{min-height:30px!important;height:30px;max-height:88px!important;padding:4px 5px!important;font-size:.86rem!important;line-height:1.3!important}.composer-bar{margin-top:1px!important;min-height:30px!important}.icon-btn{width:32px!important;height:32px!important}.send{width:33px!important;height:33px!important}.status-row{max-width:820px!important;margin:2px auto 0!important}.status{font-size:.56rem!important}
.attach-menu{min-width:260px!important;max-width:min(340px,calc(100vw - 20px))!important;padding:8px!important}.attach-section-label{padding:7px 9px 3px;color:var(--muted);font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.attach-divider{height:1px;background:var(--line);margin:5px 3px}.attach-option.connector{display:flex;align-items:center;justify-content:space-between;gap:10px}.connector-copy{display:flex;align-items:center;gap:8px}.connector-state{font-size:.58rem;color:var(--muted)}.connector-state.ready{color:#66e799}.connector-state.attention{color:#f3ce70}.attach-note{padding:6px 9px 3px;color:var(--muted);font-size:.6rem;line-height:1.35}
.smi-settings{display:none;position:absolute;right:7px;top:42px;z-index:70;width:min(330px,92vw);padding:9px;border:1px solid var(--line);border-radius:14px;background:#08130c;box-shadow:0 12px 35px #000a}.smi-settings.show{display:grid;gap:8px}.smi-setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.74rem}.smi-setting-row small{display:block;color:var(--muted);font-size:.6rem}.mobile-chats-toggle{display:none;border:1px solid var(--line);background:#10231a;color:var(--text);border-radius:999px;padding:5px 7px;font-size:.62rem;cursor:pointer}.history-backdrop{display:none;position:fixed;inset:0;background:#0008;z-index:29}
@media(max-width:820px){.workspace-grid{grid-template-columns:1fr!important}.history{display:block!important;position:fixed!important;inset:0 auto 0 0!important;width:min(82vw,290px)!important;z-index:30!important;transform:translateX(-105%);transition:transform .18s ease!important}.history.mobile-open{transform:translateX(0)!important}.history-backdrop.mobile-open{display:block!important}.mobile-chats-toggle{display:inline-flex!important}.messages{padding:6px!important}.msg{max-width:92%!important}.composer{padding:3px 5px calc(3px + env(safe-area-inset-bottom))!important}.chat-head{min-height:40px!important;padding:4px 6px!important}.chat-subtitle{font-size:.56rem!important}}
</style>
<script>
/* Personal SMI: one chat, one + menu, one governed connector boundary. */
const personalTitle=document.querySelector('.chat-title');
const personalSubtitle=document.querySelector('.chat-head .chat-subtitle');
if(personalTitle)personalTitle.textContent='Personal SMI';
if(personalSubtitle)personalSubtitle.textContent='Private Founder intelligence · straight answers · guarded actions';
document.title='Personal SMI · OAP';
const publicOapOrigin='https://on-any-postcode.onrender.com/';
const publicFrontDoor=Array.from(document.querySelectorAll('.navs a')).find(link=>link.textContent.trim()==='OAP Front Door');
if(publicFrontDoor){publicFrontDoor.href=publicOapOrigin;publicFrontDoor.rel='noopener'}

const composerInput=document.getElementById('message');
if(composerInput){
  composerInput.rows=1;composerInput.placeholder='Ask SMI…';
  const resizeComposer=()=>{composerInput.style.height='30px';composerInput.style.height=Math.min(composerInput.scrollHeight,88)+'px'};
  composerInput.addEventListener('input',resizeComposer);
  composerInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.getElementById('chat-form')?.requestSubmit()}});
  resizeComposer();
}
const thinkingPanel=document.getElementById('thinking');
const thinkingTitle=document.getElementById('thinking-title');
if(thinkingTitle)thinkingTitle.textContent='🧠 Thinking Process · safe work stages';
if(thinkingPanel){thinkingPanel.setAttribute('aria-label','Safe SMI Thinking Process stages only');thinkingPanel.setAttribute('title','Shows governed operational state only; private chain-of-thought is never exposed.');}

const historyPanel=document.querySelector('.history');
const chatHead=document.querySelector('.chat-head');
if(historyPanel&&chatHead){
  const mobileToggle=document.createElement('button');mobileToggle.type='button';mobileToggle.className='mobile-chats-toggle';mobileToggle.textContent='☰ Chats';mobileToggle.setAttribute('aria-label','Open conversation history');
  const backdrop=document.createElement('div');backdrop.className='history-backdrop';document.body.append(backdrop);
  const closeHistory=()=>{historyPanel.classList.remove('mobile-open');backdrop.classList.remove('mobile-open')};
  mobileToggle.addEventListener('click',()=>{const open=!historyPanel.classList.contains('mobile-open');historyPanel.classList.toggle('mobile-open',open);backdrop.classList.toggle('mobile-open',open)});backdrop.addEventListener('click',closeHistory);
  chatHead.insertBefore(mobileToggle,chatHead.firstChild);
  const actions=document.createElement('div');actions.className='chat-head-actions';
  const newChat=document.createElement('button');newChat.type='button';newChat.className='corner-action';newChat.textContent='＋ New';newChat.addEventListener('click',()=>document.getElementById('new-chat')?.click());
  const war=document.createElement('a');war.className='corner-action';war.href='{{ url_for('mission_control.war_room_dashboard') }}';war.textContent='⚔ War';
  const settingsButton=document.createElement('button');settingsButton.type='button';settingsButton.className='corner-action';settingsButton.textContent='⚙';settingsButton.setAttribute('aria-label','Open chat settings');
  const settings=document.createElement('div');settings.className='smi-settings';settings.setAttribute('role','dialog');settings.setAttribute('aria-label','Personal SMI chat settings');settings.innerHTML=`<label class="smi-setting-row"><span>Show work stages<small>Visible process only, never private reasoning.</small></span><input id="setting-work-stages" type="checkbox"></label><label class="smi-setting-row"><span>Voice replies<small>Read answers aloud when supported.</small></span><input id="setting-voice" type="checkbox"></label><label class="smi-setting-row"><span>Code mode<small>Bias chat toward coding tasks.</small></span><input id="setting-code" type="checkbox"></label>`;
  actions.append(newChat,war,settingsButton);chatHead.append(actions,settings);
  settingsButton.addEventListener('click',()=>settings.classList.toggle('show'));
  const stageToggle=settings.querySelector('#setting-work-stages'),voiceToggle=settings.querySelector('#setting-voice'),codeToggle=settings.querySelector('#setting-code');
  const speaker=document.getElementById('speaker-button'),code=document.getElementById('code-button');
  stageToggle.checked=localStorage.getItem('oap.smi.showWorkStages')!=='0';voiceToggle.checked=localStorage.getItem('oap.smi.voice')!=='0';codeToggle.checked=localStorage.getItem('oap.smi.code')==='1';
  thinkingPanel?.classList.toggle('user-hidden',!stageToggle.checked);speaker?.setAttribute('aria-pressed',String(voiceToggle.checked));code?.setAttribute('aria-pressed',String(codeToggle.checked));
  stageToggle.addEventListener('change',()=>{localStorage.setItem('oap.smi.showWorkStages',stageToggle.checked?'1':'0');thinkingPanel?.classList.toggle('user-hidden',!stageToggle.checked)});
  voiceToggle.addEventListener('change',()=>{localStorage.setItem('oap.smi.voice',voiceToggle.checked?'1':'0');speaker?.click()});
  codeToggle.addEventListener('change',()=>{localStorage.setItem('oap.smi.code',codeToggle.checked?'1':'0');code?.click()});
}

const plusButton=document.getElementById('plus-button');
const attachMenu=document.getElementById('attach-menu');
const messagesBox=document.getElementById('messages');
const workbenchUrl={{ url_for('mission_control.smi_workbench_status')|tojson }};
let workbenchCache=null;
const inspectLabel='Inspect';
const addToolMessage=(title,text,state='green')=>{if(!messagesBox)return;const card=document.createElement('div');card.className='msg tool-result';const heading=document.createElement('strong');heading.textContent=`${state==='green'?'🟢':'🟡'} ${title}`;const body=document.createElement('span');body.className='tool-meta';body.textContent=text;card.append(heading,body);messagesBox.append(card);messagesBox.scrollTop=messagesBox.scrollHeight};
const summariseInspection=payload=>{const data=payload?.data||payload;if(Array.isArray(data?.services))return data.services.map(service=>`${service.name||service.alias} · ${service.branch||'branch unknown'} · ${service.suspended||'state unknown'}`).join('\n');if(data?.full_name)return `${data.full_name} · ${data.default_branch||'main'} · pushed ${data.pushed_at||'time unavailable'}`;if(payload?.database){const db=payload.database;return `PostgreSQL · ${db.configured?'configured':'not configured'} · ${db.reachable?'reachable':'unreachable'} · ${db.initialized?'schema ready':db.error||'attention'}`;}if(data?.project)return `${data.project.name||'Neon'} · ${data.project.plan||'plan unknown'} · ${data.project.region||'region unknown'}`;return 'Read complete.'};
const loadWorkbench=async()=>{if(workbenchCache)return workbenchCache;const response=await fetch(workbenchUrl,{cache:'no-store',credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data?.error?.message||'Connected tools unavailable');workbenchCache=data;return data};
const inspectConnector=async(id,button)=>{button.disabled=true;const original=button.innerHTML;button.textContent='Reading…';addToolMessage('Connected tool',`Reading governed provider state for ${id}…`,'yellow');try{const workbench=await loadWorkbench();const item=workbench.connectors.find(connector=>connector.id===id);if(!item)throw new Error('Connector is not registered.');if(!item.configured){addToolMessage(item.name,'Setup needed. Credentials are never shown.','yellow');return;}if(!item.inspect_url)throw new Error('Inspect route unavailable.');const response=await fetch(item.inspect_url,{cache:'no-store',credentials:'same-origin'});const payload=await response.json();if(!response.ok)throw new Error(payload?.error?.message||'Inspection unavailable');addToolMessage(item.name,`${inspectLabel}: ${summariseInspection(payload)}`,item.ready?'green':'yellow')}catch(error){addToolMessage(id,error.message||'Inspection unavailable.','yellow')}finally{button.disabled=false;button.innerHTML=original;attachMenu?.classList.remove('show');plusButton?.setAttribute('aria-expanded','false')}};
if(plusButton&&attachMenu&&!attachMenu.querySelector('[data-oap-connectors]')){
  plusButton.setAttribute('aria-label','Open connected tools and attachments');plusButton.setAttribute('title','Add files, media or connected tools');
  const divider=document.createElement('div');divider.className='attach-divider';divider.dataset.oapConnectors='true';attachMenu.append(divider);
  const label=document.createElement('div');label.className='attach-section-label';label.textContent='Connected tools';attachMenu.append(label);
  [['render','🟣','Render'],['github','⚫','GitHub'],['neon','🟢','Neon']].forEach(([id,icon,name])=>{const button=document.createElement('button');button.type='button';button.className='attach-option connector';button.dataset.connector=id;button.innerHTML=`<span class="connector-copy"><span>${icon}</span><span>${name}</span></span><span class="connector-state" data-state-for="${id}">Check</span>`;button.addEventListener('click',()=>inspectConnector(id,button));attachMenu.append(button)});
  const war=document.createElement('button');war.type='button';war.className='attach-option connector';war.innerHTML='<span class="connector-copy"><span>⚔️</span><span>War Room</span></span><span class="connector-state ready">Proof</span>';war.addEventListener('click',()=>{window.location.href='{{ url_for('mission_control.war_room_dashboard') }}'});attachMenu.append(war);
  const note=document.createElement('div');note.className='attach-note';note.textContent='Credentials are never shown. Provider reads stay Founder-only; consequential actions still require Human Authority.';attachMenu.append(note);
  plusButton.addEventListener('click',async()=>{try{const workbench=await loadWorkbench();workbench.connectors.forEach(item=>{const state=attachMenu.querySelector(`[data-state-for="${item.id}"]`);if(!state)return;state.textContent=item.ready?'Ready':item.configured?'Attention':'Setup';state.classList.toggle('ready',Boolean(item.ready));state.classList.toggle('attention',!item.ready)})}catch(error){addToolMessage('Connected tools',error.message||'Status unavailable.','yellow')}});
}
</script>
<script>
/* OAP Studio Intelligence: minimal SMI + extension over the last-green wrapper. */
const launchStudio=async()=>{try{const workbench=await loadWorkbench();const studio=workbench.capabilities.find(item=>item.id==='oap-studio-intelligence');if(!studio)throw new Error('OAP Studio Intelligence is not registered.');composerInput.value=studio.activation_prompt||'OAP Studio Intelligence mode. Help me create: ';composerInput.focus();composerInput.dispatchEvent(new Event('input',{bubbles:true}));addToolMessage(studio.name,`${studio.powered_by||'SMI'} powered · ${(studio.pipeline||[]).join(' → ')}\nRights proof and Human Authority remain required.`,'green')}catch(error){addToolMessage('OAP Studio Intelligence',error.message||'Studio unavailable.','yellow')}finally{attachMenu?.classList.remove('show');plusButton?.setAttribute('aria-expanded','false')}};
if(plusButton&&attachMenu&&!attachMenu.querySelector('[data-oap-studio]')){const connectorDivider=attachMenu.querySelector('[data-oap-connectors]');const studioButton=document.createElement('button');studioButton.type='button';studioButton.className='attach-option connector';studioButton.dataset.oapStudio='true';studioButton.innerHTML='<span class="connector-copy"><span>🎬</span><span>OAP Studio Intelligence</span></span><span class="connector-state ready">SMI</span>';studioButton.addEventListener('click',launchStudio);attachMenu.insertBefore(studioButton,connectorDivider||attachMenu.firstChild);}
</script>
