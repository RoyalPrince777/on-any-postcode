{% include "ollama_chat_base.html" %}
<style>
/* Compact OAP Mind presentation: keep every control, reduce visual bulk. */
.workspace-grid{grid-template-columns:220px minmax(0,1fr)!important}
.history{padding:8px!important;font-size:.82rem}
.history-head{padding-bottom:5px!important}.history-list{gap:5px!important;margin-top:6px!important}
.history-item{padding:6px!important;border-radius:9px!important}
.navs{min-height:38px!important;padding:4px 7px!important;gap:5px!important}
.navs a{padding:5px 8px!important;font-size:.7rem!important}
.chat-head{padding:7px 11px!important}.chat-title{font-size:.9rem!important}.chat-subtitle{font-size:.67rem!important}
.messages{padding:10px clamp(8px,2vw,20px)!important;font-size:.9rem!important}
.msg{max-width:min(78%,720px)!important;padding:9px 11px!important;margin:6px 0!important;line-height:1.4!important;border-radius:13px!important}
.msg.system{font-size:.69rem!important;padding:5px 7px!important}.msg-actions{margin-top:5px!important}
.thinking{margin:0 10px 5px!important}.thinking-head{padding:6px 9px!important;font-size:.72rem!important}.thinking-log{padding:0 9px 6px!important;font-size:.68rem!important}
.composer{padding:6px 8px 7px!important}.composer-box{max-width:820px!important;padding:7px!important;border-radius:15px!important}
.composer textarea{min-height:36px!important;max-height:120px!important;padding:4px!important;font-size:.9rem!important}
.status-row{max-width:820px!important;margin-top:4px!important}.status{font-size:.62rem!important}
.icon-btn{width:34px!important;height:34px!important;font-size:.95rem!important}.send{width:36px!important;height:36px!important}
.tool-btn{padding:4px 7px!important;font-size:.66rem!important}.composer-left,.composer-right{gap:5px!important}.composer-bar{margin-top:3px!important}
.preview{max-width:820px!important;padding:5px!important;margin-bottom:4px!important}.preview img{width:38px!important;height:38px!important}
@media(max-width:980px){.workspace-grid{grid-template-columns:190px minmax(0,1fr)!important}}
@media(max-width:820px){.history{display:none!important}.messages{padding:8px!important}.msg{max-width:92%!important}.composer{padding:5px!important}.navs a{font-size:.67rem!important}}
</style>
