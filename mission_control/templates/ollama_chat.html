{% include "ollama_chat_base.html" %}
<style>
/* Personal SMI v5: true viewport chat, compact composer and safe Thinking Process stages. */
html,body{width:100%!important;height:100%!important;min-height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#06100a!important}
body.mc-workspace-body{margin:0!important;padding:0!important;max-width:none!important;overflow:hidden!important}
.smi-shell{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:0!important;overflow:hidden!important}
.navs{flex:0 0 34px!important;min-height:34px!important;height:34px!important;padding:3px 6px!important;gap:4px!important;border-bottom:1px solid var(--line)!important;overflow-x:auto!important}
.navs a{padding:4px 7px!important;font-size:.64rem!important;line-height:1!important}
.workspace-grid{flex:1!important;min-height:0!important;height:calc(100dvh - 34px)!important;grid-template-columns:210px minmax(0,1fr)!important;gap:0!important;margin:0!important;overflow:hidden!important}
.history{padding:7px!important;font-size:.78rem!important;min-height:0!important;height:100%!important;overflow-y:auto!important}
.history-head{padding-bottom:4px!important}.history-list{gap:4px!important;margin-top:5px!important}.history-item{padding:5px 6px!important;border-radius:8px!important}.history-preview,.history-empty{font-size:.66rem!important}
.chatbox{height:100%!important;min-height:0!important;overflow:hidden!important;display:flex!important;flex-direction:column!important}
.chat-head{position:relative;flex:0 0 38px!important;min-height:38px!important;padding:4px 8px!important;gap:6px!important}.chat-title{font-size:.84rem!important;line-height:1.05!important}.chat-subtitle{font-size:.61rem!important;line-height:1.1!important}
.chat-head-actions{margin-left:auto;display:flex;align-items:center;gap:5px}.corner-action{border:1px solid var(--line);background:#10231a;color:var(--text);border-radius:999px;padding:5px 8px;font-size:.62rem;line-height:1;cursor:pointer}.corner-action:hover,.corner-action:focus{border-color:var(--green)}
.smi-settings{display:none;position:absolute;right:7px;top:37px;z-index:40;width:min(300px,90vw);padding:8px;border:1px solid var(--line);border-radius:12px;background:#08130c;box-shadow:0 12px 35px #000a}.smi-settings.show{display:grid;gap:7px}.smi-setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.72rem;color:var(--text)}.smi-setting-row small{display:block;color:var(--muted);font-size:.6rem}.smi-setting-row input{accent-color:var(--green)}
.messages{flex:1 1 auto!important;min-height:0!important;max-height:none!important;overflow-y:auto!important;overscroll-behavior:contain!important;padding:8px clamp(8px,2vw,20px) 6px!important;font-size:.88rem!important}
.msg{max-width:min(76%,700px)!important;padding:8px 10px!important;margin:4px 0!important;line-height:1.38!important;border-radius:12px!important}.msg.system{max-width:100%!important;font-size:.65rem!important;padding:4px 6px!important;margin:2px 0!important}.msg-actions{margin-top:3px!important}.copy{padding:3px 6px!important;font-size:.64rem!important}
.code-block{margin:6px 0!important;border-radius:9px!important}.code-head{padding:5px 7px!important;font-size:.65rem!important}.code-block pre{padding:8px!important;font-size:.78rem!important}
.thinking{flex:0 0 auto!important;margin:0 8px 4px!important;border-radius:9px!important;max-height:104px!important;overflow:auto!important}.thinking-head{padding:4px 7px!important;font-size:.67rem!important;line-height:1.15!important}.thinking-dot{width:6px!important;height:6px!important;background:var(--muted)!important;box-shadow:none!important;animation:none!important}.thinking-log{padding:0 7px 4px!important;font-size:.63rem!important;line-height:1.18!important;gap:1px!important}.thinking-log span::before{content:'✓ '!important}.thinking.user-hidden{display:none!important}
.composer{flex:0 0 auto!important;padding:4px 7px 4px!important;border-top:1px solid var(--line)!important}.composer-box{max-width:760px!important;padding:4px 5px!important;border-radius:13px!important;margin:0 auto!important}.composer textarea{min-height:30px!important;height:30px;max-height:88px!important;padding:4px 5px!important;font-size:.86rem!important;line-height:1.3!important;overflow-y:auto!important}.composer-bar{margin-top:1px!important;min-height:30px!important}.composer-left,.composer-right{gap:4px!important}.icon-btn{width:30px!important;height:30px!important;font-size:.84rem!important}.send{width:31px!important;height:31px!important}.tool-btn{padding:3px 6px!important;font-size:.61rem!important}.status-row{max-width:760px!important;margin:2px auto 0!important;min-height:12px!important}.status{font-size:.56rem!important;line-height:1.1!important}.name-input{height:24px!important;padding:3px 7px!important;font-size:.61rem!important}.preview{max-width:760px!important;margin:0 auto 3px!important;padding:4px!important}.preview img{width:32px!important;height:32px!important}.attach-menu{bottom:36px!important;min-width:190px!important;padding:5px!important}.attach-option{padding:7px!important;font-size:.76rem!important}
.mobile-chats-toggle{display:none;border:1px solid var(--line);background:#10231a;color:var(--text);border-radius:999px;padding:4px 7px;font-size:.62rem;cursor:pointer}.history-backdrop{display:none;position:fixed;inset:34px 0 0;background:#0008;z-index:19}
@media(max-width:980px){.workspace-grid{grid-template-columns:180px minmax(0,1fr)!important}.msg{max-width:84%!important}}
@media(max-width:820px){
 .navs{display:none!important}.workspace-grid{height:100dvh!important;grid-template-columns:1fr!important;grid-template-rows:minmax(0,1fr)!important}.chatbox{height:100dvh!important}.chat-head{flex:0 0 40px!important;min-height:40px!important;padding:4px 6px!important}.mobile-chats-toggle{display:inline-flex!important;align-items:center!important}.chat-head-actions{gap:4px}.corner-action{padding:5px 7px!important;font-size:.6rem!important}.smi-settings{top:39px;right:5px}
 .history{display:block!important;position:fixed!important;top:0!important;left:0!important;bottom:0!important;width:min(82vw,290px)!important;z-index:30!important;transform:translateX(-105%);transition:transform .18s ease!important;box-shadow:10px 0 30px #0009!important;border-right:1px solid var(--line)!important}.history.mobile-open{transform:translateX(0)!important}.history-backdrop.mobile-open{display:block!important;inset:0!important;z-index:29!important}
 .messages{padding:6px 7px 5px!important}.msg{max-width:91%!important;padding:7px 9px!important;margin:3px 0!important}.composer{padding:3px 5px calc(3px + env(safe-area-inset-bottom))!important}.composer-box{max-width:none!important;padding:3px 4px!important;border-radius:12px!important}.composer textarea{min-height:28px!important;height:28px;max-height:76px!important;font-size:.85rem!important;padding:3px 4px!important}.icon-btn{width:29px!important;height:29px!important}.send{width:30px!important;height:30px!important}.tool-btn{padding:3px 5px!important}.status-row{display:flex!important;margin-top:1px!important}.status{font-size:.52rem!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.name-input{display:none!important}.thinking{margin:0 5px 3px!important;max-height:92px!important}.chat-subtitle{font-size:.56rem!important}
}
@media(max-width:520px){.chat-head .chat-subtitle:not(#provider-state){display:none}.corner-action span{display:none}.corner-action{width:30px;height:30px;padding:0!important;display:grid;place-items:center}}
@media(max-height:600px){.composer textarea{max-height:60px!important}.thinking{max-height:70px!important}}
</style>
<script>
/* Personal SMI is the identity. The Thinking Process shows safe work stages only; private chain-of-thought stays private. */
const personalTitle=document.querySelector('.chat-title');
const personalSubtitle=document.querySelector('.chat-head .chat-subtitle');
if(personalTitle)personalTitle.textContent='Personal SMI';
if(personalSubtitle)personalSubtitle.textContent='Private Founder intelligence · HRM · Aegis';
document.title='Personal SMI · OAP Mind';

const composerInput=document.getElementById('message');
if(composerInput){
  composerInput.rows=1;
  composerInput.placeholder='Message Personal SMI…';
  const resizeComposer=()=>{composerInput.style.height='30px';composerInput.style.height=Math.min(composerInput.scrollHeight,88)+'px'};
  composerInput.addEventListener('input',resizeComposer);
  composerInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.getElementById('chat-form')?.requestSubmit()}});
  resizeComposer();
}
const thinkingTitle=document.getElementById('thinking-title');
if(thinkingTitle)thinkingTitle.textContent='🧠 Thinking Process';
const thinkingPanel=document.getElementById('thinking');
if(thinkingPanel){
  thinkingPanel.setAttribute('aria-label','SMI Thinking Process — safe work stages only');
  thinkingPanel.setAttribute('title','Understand · Context · Route · Evidence · Challenge · Synthesise · Govern. Private chain-of-thought is never exposed.');
}
const providerStateLabel=document.getElementById('provider-state');
if(providerStateLabel)providerStateLabel.setAttribute('title','Shows governed operational state only; private chain-of-thought is never exposed.');

const historyPanel=document.querySelector('.history');
const chatHead=document.querySelector('.chat-head');
if(historyPanel&&chatHead){
  const toggle=document.createElement('button');toggle.type='button';toggle.className='mobile-chats-toggle';toggle.textContent='☰ Chats';toggle.setAttribute('aria-label','Open conversation history');
  const backdrop=document.createElement('div');backdrop.className='history-backdrop';document.body.append(backdrop);
  const closeHistory=()=>{historyPanel.classList.remove('mobile-open');backdrop.classList.remove('mobile-open');toggle.setAttribute('aria-expanded','false')};
  toggle.addEventListener('click',()=>{const opening=!historyPanel.classList.contains('mobile-open');historyPanel.classList.toggle('mobile-open',opening);backdrop.classList.toggle('mobile-open',opening);toggle.setAttribute('aria-expanded',String(opening))});
  backdrop.addEventListener('click',closeHistory);
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeHistory()});
  chatHead.insertBefore(toggle,chatHead.firstChild);

  const actions=document.createElement('div');actions.className='chat-head-actions';
  const newChat=document.createElement('button');newChat.type='button';newChat.className='corner-action';newChat.setAttribute('aria-label','Start new chat');newChat.innerHTML='＋ <span>New chat</span>';
  newChat.addEventListener('click',()=>document.getElementById('new-chat')?.click());
  const settingsButton=document.createElement('button');settingsButton.type='button';settingsButton.className='corner-action';settingsButton.setAttribute('aria-label','Open chat settings');settingsButton.setAttribute('aria-expanded','false');settingsButton.innerHTML='⚙ <span>Settings</span>';
  const settings=document.createElement('div');settings.className='smi-settings';settings.setAttribute('role','dialog');settings.setAttribute('aria-label','Personal SMI chat settings');
  settings.innerHTML=`
    <label class="smi-setting-row"><span>Show Thinking Process<small>Seven safe work stages only — never private reasoning.</small></span><input id="setting-work-stages" type="checkbox"></label>
    <label class="smi-setting-row"><span>Voice replies<small>Read answers aloud when supported.</small></span><input id="setting-voice" type="checkbox"></label>
    <label class="smi-setting-row"><span>Code mode<small>Bias the chat toward coding tasks.</small></span><input id="setting-code" type="checkbox"></label>`;
  actions.append(newChat,settingsButton);chatHead.append(actions,settings);
  const stageToggle=settings.querySelector('#setting-work-stages');
  const voiceToggle=settings.querySelector('#setting-voice');
  const codeToggle=settings.querySelector('#setting-code');
  const speaker=document.getElementById('speaker-button');
  const code=document.getElementById('code-button');
  const storedStages=localStorage.getItem('oap.smi.showWorkStages');
  stageToggle.checked=storedStages===null?true:storedStages==='1';
  if(!stageToggle.checked)thinkingPanel?.classList.add('user-hidden');
  voiceToggle.checked=speaker?.getAttribute('aria-pressed')==='true';
  codeToggle.checked=code?.getAttribute('aria-pressed')==='true';
  stageToggle.addEventListener('change',()=>{localStorage.setItem('oap.smi.showWorkStages',stageToggle.checked?'1':'0');thinkingPanel?.classList.toggle('user-hidden',!stageToggle.checked)});
  voiceToggle.addEventListener('change',()=>{if((speaker?.getAttribute('aria-pressed')==='true')!==voiceToggle.checked)speaker?.click()});
  codeToggle.addEventListener('change',()=>{if((code?.getAttribute('aria-pressed')==='true')!==codeToggle.checked)code?.click()});
  settingsButton.addEventListener('click',()=>{const open=!settings.classList.contains('show');settings.classList.toggle('show',open);settingsButton.setAttribute('aria-expanded',String(open))});
  document.addEventListener('click',event=>{if(!settings.contains(event.target)&&!settingsButton.contains(event.target)){settings.classList.remove('show');settingsButton.setAttribute('aria-expanded','false')}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){settings.classList.remove('show');settingsButton.setAttribute('aria-expanded','false')}});
}
</script>
