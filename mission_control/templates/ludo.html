<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="oap-csrf-token" content="{{ csrf_token }}">
<title>Ludo · OAP Arena</title>
<link rel="stylesheet" href="{{ url_for('public_stylesheet') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='arena_games.css') }}">
<style>
:root{--bg:#061019;--panel:rgba(7,17,27,.88);--line:#28475f;--text:#f8fbff;--muted:#9eb3c4;--gold:#f6c453;--screen-w:100vw;--screen-h:100dvh;--board-size:min(100vw,100dvh);--board-left:calc((100vw - var(--board-size))/2);--board-top:calc((100dvh - var(--board-size))/2);--ui-scale:1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#061019;color:var(--text);overflow:hidden}
body{min-height:100dvh;overscroll-behavior:none}
.game-shell{position:fixed;inset:0;width:var(--screen-w);height:var(--screen-h);min-height:0;overflow:hidden;background:radial-gradient(circle at top,#173047,#061019 58%)}
.game-topbar{position:fixed;top:0;left:0;width:var(--screen-w);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;position:relative;z-index:20}
.brand-lockup{display:flex;align-items:center;gap:8px}.brand-lockup strong{font-size:1rem}.brand-lockup span{font-size:.72rem;color:var(--muted)}
.icon-btn,.game-btn,.settings-btn{min-height:44px;border:1px solid #36566f;border-radius:14px;background:#0d1b28;color:#fff;font-weight:900;padding:0 14px}
.settings-btn{background:#102435}
.game-stage{position:fixed;left:0;top:0;width:var(--screen-w);height:var(--screen-h);display:block;min-height:0;padding:0;overflow:hidden}
.board-stage{position:absolute;left:var(--board-left);top:var(--board-top);width:var(--board-size);height:var(--board-size);max-width:none;max-height:none;aspect-ratio:1;background:linear-gradient(145deg,#102538,#09141e);border:1px solid #29465e;border-radius:22px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.42)}
.ludo-board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);width:100%;height:100%;background:#e8edf2;border-radius:16px;overflow:hidden;border:4px solid #07111b}
.ludo-cell{border:1px solid rgba(8,20,30,.16);background:#f5f7f9;position:relative}.ludo-cell.track{background:#fff}
.ludo-cell.safe::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:.72em;color:#344d62}
.ludo-cell.green-lane{background:#8ee2ac}.ludo-cell.red-lane{background:#f5a0a0}.ludo-cell.yellow-lane{background:#f5e37d}.ludo-cell.blue-lane{background:#94c8f5}
.home-zone{position:absolute;width:40%;height:40%;display:grid;place-items:center;padding:6%}.home-zone .yard{width:100%;height:100%;background:rgba(255,255,255,.92);border-radius:18%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10%;padding:10%}
.home-zone.green{left:0;top:0;background:#168f43}.home-zone.red{right:0;top:0;background:#ce2d33}.home-zone.yellow{left:0;bottom:0;background:#e5b915}.home-zone.blue{right:0;bottom:0;background:#287dce}
.yard-slot{border-radius:50%;background:#e9eef3;border:3px solid rgba(0,0,0,.15)}
.center-home{position:absolute;left:40%;top:40%;width:20%;height:20%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:conic-gradient(#cf3036 0 25%,#287dce 0 50%,#e5b915 0 75%,#168f43 0);display:grid;place-items:center;z-index:2}.center-home span{background:#07111b;color:#fff;border-radius:999px;padding:4px 7px;font-size:clamp(.42rem,1.4vw,.72rem);font-weight:950}
.board-piece{position:absolute;width:5.4%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.55);z-index:8;transform:translate(-50%,-50%);transition:left .22s ease,top .22s ease,transform .15s ease}.board-piece.selectable{outline:3px solid var(--gold);outline-offset:2px;cursor:pointer;animation:pulsePiece 1s infinite}
.board-piece.green{background:#19aa53}.board-piece.red{background:#e24449}.board-piece.yellow{background:#f3ca24}.board-piece.blue{background:#3694eb}
@keyframes pulsePiece{50%{transform:translate(-50%,-50%) scale(1.18)}}@keyframes diceRoll{0%{transform:translate(0,0) rotate(0) scale(1)}15%{transform:translate(-5px,2px) rotate(-18deg) scale(1.06)}30%{transform:translate(5px,-3px) rotate(32deg) scale(.96)}45%{transform:translate(-4px,-2px) rotate(88deg) scale(1.08)}60%{transform:translate(4px,3px) rotate(170deg) scale(.98)}80%{transform:translate(-2px,0) rotate(270deg) scale(1.05)}100%{transform:translate(0,0) rotate(360deg) scale(1)}}@keyframes diceLanded{0%{box-shadow:inset 0 0 0 4px #dfe7ee,0 8px 20px rgba(0,0,0,.32)}50%{box-shadow:inset 0 0 0 4px #f6c453,0 0 0 6px rgba(246,196,83,.24),0 10px 24px rgba(0,0,0,.38)}100%{box-shadow:inset 0 0 0 4px #dfe7ee,0 8px 20px rgba(0,0,0,.32)}}.die.rolling{animation:diceRoll .72s cubic-bezier(.2,.7,.2,1)}.die.landed{animation:diceLanded .6s ease}
.hud{position:absolute;inset:auto 14px 14px 14px;z-index:15;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;pointer-events:none}.dice-dock{position:absolute;right:14px;top:72px;z-index:16;pointer-events:auto;background:rgba(5,14,23,.88);backdrop-filter:blur(10px);border:1px solid #29465e;border-radius:18px;padding:8px;display:grid;gap:5px;justify-items:center}.dice-caption{font-size:.65rem;color:var(--muted);font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.hud-left,.hud-actions{pointer-events:auto;background:rgba(5,14,23,.88);backdrop-filter:blur(10px);border:1px solid #29465e;border-radius:16px;padding:8px}
.hud-left{display:flex;align-items:center;gap:10px;min-width:0}.hud-copy{min-width:0}.hud-label{font-size:.67rem;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.hud-turn{font-size:.95rem;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.die{width:68px;height:68px;border-radius:18px;transition:transform .12s ease,box-shadow .18s ease;transform-origin:center;background:#fff;color:#07111b;display:grid;place-items:center;font-size:2.15rem;font-weight:950;box-shadow:inset 0 0 0 4px #dfe7ee,0 8px 20px rgba(0,0,0,.32)}
.hud-actions{display:grid;grid-template-columns:repeat(2,minmax(72px,1fr));gap:6px}.game-btn{padding:0 10px}.roll-btn{background:linear-gradient(135deg,#f6c453,#e79c17);color:#07111b;border:none}.move-panel{position:absolute;left:14px;right:14px;top:14px;z-index:14;pointer-events:none}.move-panel-inner{display:none;pointer-events:auto;background:rgba(5,14,23,.86);backdrop-filter:blur(10px);border:1px solid #29465e;border-radius:16px;padding:8px;max-height:28vh;overflow:auto}.move-panel-inner.active{display:block}
.arena-game-content{display:grid;gap:6px}.player-entry{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 9px;border:1px solid #28455d;border-radius:12px}.player-entry span{font-size:.78rem;color:var(--muted)}
.status-strip{position:fixed;left:0;width:var(--screen-w);bottom:0;z-index:20;padding:7px 12px calc(8px + env(safe-area-inset-bottom));font-size:.82rem;color:var(--muted);text-align:center;min-height:38px;background:linear-gradient(transparent,rgba(6,16,25,.9))}
.settings-drawer{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);padding:12px}.settings-drawer[open]{display:grid;place-items:end center}.settings-card{width:min(100%,520px);background:#0b1824;border:1px solid #31516a;border-radius:22px;padding:16px;box-shadow:0 25px 80px rgba(0,0,0,.5)}.settings-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.settings-card input,.settings-card select{width:100%;margin:8px 0 12px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.settings-grid>*{min-height:46px}
.arena-error{color:#ffb2b2;min-height:20px}
@media(min-width:900px){.hud{inset:auto 18px 18px 18px}}
@media(max-width:600px){.game-topbar{padding-inline:8px}.board-stage{border-radius:0;padding:0}.ludo-board{border-radius:12px}.hud{inset:auto 8px 8px 8px}.hud-left,.hud-actions{padding:6px}.dice-dock{right:8px;top:62px;padding:6px}.die{width:62px;height:62px;font-size:1.95rem}.game-btn{min-height:42px;font-size:.78rem}.move-panel{left:8px;right:8px;top:8px}.settings-grid{grid-template-columns:1fr}}
.screen-landscape .board-stage{left:0;top:0}
.screen-landscape .game-topbar{left:var(--board-size);width:calc(var(--screen-w) - var(--board-size));right:auto;flex-direction:column;align-items:stretch;background:rgba(6,16,25,.84);backdrop-filter:blur(8px);padding:10px}
.screen-landscape .brand-lockup{flex-direction:column;align-items:flex-start}
.screen-landscape .status-strip{left:var(--board-size);width:calc(var(--screen-w) - var(--board-size));bottom:0}
.screen-landscape .hud{left:calc(var(--board-size) + 10px);right:10px;bottom:68px;grid-template-columns:1fr}.screen-landscape .dice-dock{left:calc(var(--board-size) + 10px);right:10px;top:110px;justify-items:stretch}.screen-landscape .die{width:100%;height:72px}
.screen-landscape .move-panel{left:calc(var(--board-size) + 10px);right:10px;top:205px}
.screen-landscape .hud-actions{grid-template-columns:1fr 1fr}
.screen-portrait .board-stage{left:var(--board-left);top:var(--board-top)}
.screen-compact .brand-lockup span{display:none}
.screen-compact .settings-btn{padding:0 10px;min-height:40px}
:fullscreen{width:100vw!important;height:100vh!important;margin:0!important;padding:0!important;background:#061019!important}
:-webkit-full-screen{width:100vw!important;height:100vh!important;margin:0!important;padding:0!important;background:#061019!important}
.game-shell:fullscreen,.game-shell:-webkit-full-screen{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important}
.game-shell:fullscreen .game-stage,.game-shell:-webkit-full-screen .game-stage{width:100vw!important;height:100vh!important}
::backdrop{background:#061019}
.game-shell.is-booting{visibility:hidden;opacity:0}
.game-shell.is-ready{visibility:visible;opacity:1;transition:opacity .08s linear}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="{{ url_for('static',filename='ludo.js') }}" defer></script>
</head>
<body>
<main class="game-shell is-booting" data-ludo-root aria-busy="true">
  <header class="game-topbar">
    <div class="brand-lockup"><strong>🎲 OAP Ludo</strong><span>Powered by ON ANY POSTCODE</span></div>
    <div style="display:flex;gap:6px"><button class="settings-btn" type="button" data-fullscreen>⛶</button><button class="settings-btn" type="button" data-open-settings>⚙ Settings</button></div>
  </header>

  <section class="game-stage">
    <div class="board-stage">
      <div class="ludo-board" data-visual-board aria-label="OAP Arena Ludo board"></div>

      <div class="move-panel">
        <div class="move-panel-inner" data-move-panel data-game hidden>
          <div class="hud-label">Choose Piece</div>
          <div class="arena-game-content" data-players-view></div>
        </div>
      </div>

      <div class="result-overlay" data-results hidden style="position:absolute;inset:14%;z-index:30;display:grid;place-items:center;background:rgba(5,14,23,.94);border:1px solid #36566f;border-radius:22px;padding:18px;text-align:center">
        <div>
          <div class="hud-label">Results</div>
          <h2 data-result-title style="margin:.35rem 0 1rem">Arena Winner</h2>
          <div class="settings-grid">
            <button class="game-btn roll-btn" type="button" data-rematch>REMATCH</button>
            <a class="game-btn" href="/arena" style="display:grid;place-items:center;text-decoration:none">OAP ARENA</a>
          </div>
        </div>
      </div>

      <div class="dice-dock"><div class="dice-caption">Tap to roll</div><button class="die" type="button" data-roll data-roll-value disabled aria-label="Roll dice">⚄</button></div>

      <div class="hud">
        <div class="hud-left">
          <div class="hud-copy">
            <div class="hud-label">Turn</div>
            <div class="hud-turn" data-turn>—</div>
            <div class="hud-label" data-status>Open</div>
          </div>
        </div>
        <div class="hud-actions">
          <button class="game-btn" type="button" data-open-settings>⚙</button>
          <a class="game-btn" href="/arena" style="display:grid;place-items:center;text-decoration:none">←</a>
        </div>
      </div>
    </div>
  </section>

  <div class="status-strip"><div data-feedback aria-live="polite">Open Settings to start a match.</div><strong style="display:block;margin-top:2px;color:#fff">Powered by ON ANY POSTCODE</strong></div>

  <dialog class="settings-drawer" data-settings>
    <section class="settings-card">
      <div class="settings-head">
        <div><div class="hud-label">Game Setup</div><strong>OAP Ludo Settings</strong></div>
        <button class="icon-btn" type="button" data-close-settings>✕</button>
      </div>
      <label class="hud-label" for="mode">Opponent</label>
      <select id="mode" data-mode>
        <option value="1a">1 Player + Arena Agent</option>
        <option value="2a">2 Players + 2 Arena Agents</option>
        <option value="4h">4 Players</option>
      </select>
      <label class="hud-label" for="players">Player names</label>
      <input id="players" data-players maxlength="180" value="Player One, Player Two" autocomplete="off">
      <label class="hud-label" for="difficulty">Arena Agent</label>
      <select id="difficulty" data-difficulty>
        <option value="easy">Easy</option>
        <option value="sharp" selected>Sharp</option>
        <option value="ruthless">Ruthless</option>
      </select>
      <label class="hud-label" for="speed">Game speed</label>
      <select id="speed" data-speed>
        <option value="slow">Slow</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Fast</option>
      </select>
      <div class="settings-grid" style="margin:10px 0">
        <label class="game-btn" style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-sound checked> Sound</label>
        <label class="game-btn" style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-haptics checked> Haptics</label>
      </div>
      <div class="settings-grid">
        <button class="game-btn roll-btn" type="button" data-start>START MATCH</button>
        <a class="game-btn" href="/arena/ludo/room" style="display:grid;place-items:center;text-decoration:none">LINK IN</a>
        <button class="game-btn" type="button" data-stop disabled>LEAVE MATCH</button>
        <a class="game-btn" href="/arena" style="display:grid;place-items:center;text-decoration:none">OAP ARENA</a>
      </div>
      <p class="arena-error" role="alert" data-error></p>
    </section>
  </dialog>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const root=document.querySelector("[data-ludo-root]"); if(!root)return;
 const dlg=root.querySelector("[data-settings]");
 root.querySelectorAll("[data-open-settings]").forEach(b=>b.addEventListener("click",()=>dlg.showModal()));
 root.querySelector("[data-close-settings]")?.addEventListener("click",()=>dlg.close());
 dlg?.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
 if(dlg&&!dlg.open)dlg.showModal();
});
</script>
</body>
</html>
