<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAP The Spot — {{ capability.name }}</title>
  <link rel="stylesheet" href="{{ url_for('public_stylesheet') }}">
</head>
<body class="mc-workspace-body">
  <header class="mc-workspace-header">
    <div>
      <p class="mc-eyebrow">OAP World / The Spot</p>
      <h1>{{ capability.name }}</h1>
      <p>{{ capability.purpose }}</p>
    </div>
    <div class="mc-header-actions">
      <a class="mc-secondary-link" href="{{ url_for('the_spot_front_door') }}">Back to The Spot</a>
      <a class="mc-secondary-link" href="{{ url_for('home') }}">OAP World</a>
    </div>
  </header>
  <main class="mc-workspace">
    <section class="mc-panel">
      <p class="mc-eyebrow">Your postcode</p>
      <h2>Discover more in My World</h2>
      <p>Sign in to personalise this part of OAP.</p>
      <a class="mc-secondary-link" href="{{ url_for('auth_page') }}">Enter My World →</a>
    </section>
  </main>
</body>
</html>
