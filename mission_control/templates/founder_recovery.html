<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Founder Access · ON ANY POSTCODE</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070908;color:#f7f7f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(92vw,420px)}
    h1{margin:0 0 1.15rem;font-size:clamp(2rem,8vw,2.8rem);letter-spacing:-.04em}
    form{display:grid;gap:.8rem}
    input,button{width:100%;min-height:54px;border-radius:16px;font:inherit}
    input{padding:0 1rem;border:1px solid rgba(255,255,255,.15);background:#111411;color:#fff;outline:none}
    input:focus{border-color:rgba(255,255,255,.55)}
    button{border:0;background:#f5f5ef;color:#090a09;font-weight:800;cursor:pointer}
    .error{margin:0 0 .9rem;padding:.8rem 1rem;border-radius:14px;background:rgba(255,255,255,.07);color:#fff}
  </style>
</head>
<body>
  <main>
    <h1>Founder Access</h1>
    {% if recovery_error %}<p class="error" role="alert">{{ recovery_error }}</p>{% endif %}
    <form method="post" action="{{ url_for('founder_recovery.recover_founder') }}" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ oap_csrf_token }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <input aria-label="Founder code" name="recovery_code" type="password" minlength="32" maxlength="256" required autocomplete="one-time-code" autofocus placeholder="Founder code">
      <button type="submit">Enter SMI</button>
    </form>
  </main>
</body>
</html>
